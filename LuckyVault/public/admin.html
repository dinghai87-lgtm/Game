<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
<title>Lucky Vault — Back Office</title>
<meta name="copyright" content="© 2026 万泰游戏开发 Wantai Game Development">
<style>
:root{--bg:#0b1118;--panel:#141d28;--panel2:#1b2735;--line:#253447;--txt:#e6edf5;--mute:#8797ab;--acc:#24d17e;--red:#ff4d6d;--gold:#ffc83d;--blue:#4ea8ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.layout{display:flex;min-height:100vh}
nav{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh}
nav .logo{font-weight:900;font-size:17px;padding:4px 10px 16px}
nav .logo i{font-style:normal;color:var(--acc)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--mute);font-weight:700}
nav button.on,nav button:hover{background:var(--panel2);color:var(--txt)}
nav .out{position:absolute;bottom:16px;left:10px;right:10px;width:auto}
main{flex:1;min-width:0;padding:22px}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--mute);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kpi b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;overflow:auto}
.box h2{font-size:15px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
td{padding:8px;border-bottom:1px solid #1c2837;white-space:nowrap}
tr:hover td{background:#18222f}
.num{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}
.pill.g{background:rgba(36,209,126,.15);color:var(--acc)}.pill.r{background:rgba(255,77,109,.15);color:var(--red)}.pill.y{background:rgba(255,200,61,.15);color:var(--gold)}.pill.b{background:rgba(78,168,255,.15);color:var(--blue)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#04140b}
.btn.d{border-color:rgba(255,77,109,.5);color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pos{color:var(--acc)}.neg{color:var(--red)}
#login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px}
#login h1{text-align:center}
.warn{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.4);color:var(--gold);padding:10px 12px;border-radius:10px;margin-bottom:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}
.modal .c{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,92vw);display:flex;flex-direction:column;gap:10px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.form{display:grid;grid-template-columns:200px 1fr;gap:10px 14px;align-items:center;max-width:640px}
.form label{color:var(--mute);font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:20}
@media(max-width:800px){.layout{flex-direction:column}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}nav .logo{display:none}nav button{width:auto;white-space:nowrap}nav .out{position:static}main{padding:14px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<form id="login" style="display:none"><h1>🎰 Back Office</h1><p class="sub" style="text-align:center">Lucky Vault administration</p>
 <input id="lu" placeholder="Admin user" value="admin" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><input id="lc" placeholder="两步验证码 2FA code (if enabled)" inputmode="numeric" autocomplete="one-time-code" style="display:none">
 <button class="btn p" style="padding:11px">Log in</button><p id="lerr" style="color:var(--red);min-height:18px"></p></form>
<div class="layout" id="app" style="display:none">
 <nav id="nav"><div class="logo">🎰 LUCKY<i>VAULT</i></div></nav>
 <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="c" id="mc"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let TOKEN=null;try{TOKEN=sessionStorage.getItem('lv_admin')}catch(e){}
const fmt=(v,d=2)=>v==null?'—':(+v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const int=v=>v==null?'—':(+v).toLocaleString('en-US');
const dt=t=>t?new Date(t).toLocaleString():'—';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error('auth')}if(j.err)toast(j.msg||j.err);return j}
try{window.ME=JSON.parse(sessionStorage.getItem('lv_admin_me')||'null')}catch(e){}
function logout(){TOKEN=null;window.ME=null;try{sessionStorage.removeItem('lv_admin')}catch(e){}$('#app').style.display='none';$('#login').style.display='flex'}
$('#login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('#lu').value,pass:$('#lp').value,code:$('#lc').value})}).then(r=>r.json());
 if(r.err){if(r.need2fa){$('#lc').style.display='';$('#lc').focus()}$('#lerr').textContent=r.msg||r.err;return}TOKEN=r.token;window.ME={user:r.user,role:r.role};try{sessionStorage.setItem('lv_admin_me',JSON.stringify(window.ME))}catch(e){}try{sessionStorage.setItem('lv_admin',TOKEN)}catch(e){}window.DEFPASS=r.defaultPass;start()};
const PAGES=[['overview','📊 Overview'],['games','🎰 Games'],['players','👥 Players'],['orders','💳 Orders'],['rounds','🎲 Game rounds'],['tx','📒 Coin ledger'],['analytics','📈 Analytics'],['campaigns','📣 Campaigns'],['tournaments','🏆 Tournaments'],['risk','🚩 Risk'],['settings','⚙️ Settings'],['system','🩺 System'],['tickets','🎧 Support'],['audit','🛡️ Audit log'],['admins','🔑 Admins'],['me','👤 My account']];
// which pages each back-office role sees (the server enforces the same rules)
const ROLEPAGES={support:['overview','players','orders','rounds','tx','tickets','me'],viewer:['overview','games','players','orders','rounds','tx','analytics','campaigns','tournaments','risk','system','audit','tickets','me'],ops:PAGES.map(x=>x[0]).filter(k=>!['settings','admins'].includes(k)),admin:PAGES.map(x=>x[0]).filter(k=>k!=='admins')};
function myPages(){const r=(window.ME||{}).role||'owner';return ROLEPAGES[r]||PAGES.map(x=>x[0])}
let page='overview';
function start(){$('#login').style.display='none';$('#app').style.display='flex';
 if(!myPages().includes(page))page=myPages()[0];$('#nav').innerHTML='<div class="logo">🎰 LUCKY<i>VAULT</i></div>'+(window.ME?'<div style="padding:4px 14px 10px;font-size:12px;color:var(--mute)">'+esc(ME.user)+' · '+esc(ME.role)+'</div>':'')+PAGES.filter(([k])=>myPages().includes(k)).map(([k,n])=>'<button data-p="'+k+'" class="'+(k===page?'on':'')+'">'+n+'</button>').join('')+'<button class="out" id="out">↩ Log out</button>';
 $('#nav').onclick=e=>{const b=e.target.closest('[data-p]');if(b){page=b.dataset.p;start()}};$('#out').onclick=logout;render()}
async function render(){const m=$('#main');try{await R[page](m)}catch(e){if(e.message!=='auth')m.innerHTML='<div class="box">Failed to load: '+esc(e.message)+'</div>'}}
const rtpCls=(a,t)=>a==null?'':Math.abs(a-t)<=3?'pos':'neg';
function dr(id){const f=$('#'+id+'f'),t=$('#'+id+'t');let q='';if(f&&f.value)q+='&from='+new Date(f.value+'T00:00').getTime();if(t&&t.value)q+='&to='+(new Date(t.value+'T00:00').getTime()+864e5);return q}
const DR={};
function csv(name,rows){if(!rows.length){toast('Nothing to export');return}const keys=Object.keys(rows[0]);const q=v=>{v=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const t=[keys.join(',')].concat(rows.map(r=>keys.map(k=>q(r[k])).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove()}
function bars(days,key,color,fmtv){const max=Math.max(1,...days.map(d=>d[key]));const W=560,H=150,bw=W/days.length;
 return '<svg viewBox="0 0 '+W+' '+(H+22)+'" style="width:100%;height:auto">'+days.map((d,i)=>{const h=d[key]/max*(H-14);return '<rect x="'+(i*bw+4)+'" y="'+(H-h)+'" width="'+(bw-8)+'" height="'+Math.max(h,1)+'" rx="3" fill="'+color+'"><title>'+d.day+': '+fmtv(d[key])+'</title></rect>'+(d[key]?'<text x="'+(i*bw+bw/2)+'" y="'+(H-h-3)+'" fill="#8797ab" font-size="9" text-anchor="middle">'+fmtv(d[key])+'</text>':'')+'<text x="'+(i*bw+bw/2)+'" y="'+(H+15)+'" fill="#8797ab" font-size="9" text-anchor="middle">'+d.day+'</text>'}).join('')+'</svg>'}
const R={
 async overview(m){const o=await api('/api/admin/overview');
  const k=(l,v,s)=>'<div class="kpi"><small>'+l+'</small><b>'+v+'</b>'+(s?'<span>'+s+'</span>':'')+'</div>';
  const top=o.games.slice().sort((a,b)=>b.bet-a.bet).slice(0,10);const maxB=Math.max(1,...top.map(g=>g.bet));
  m.innerHTML=(window.DEFPASS?'<div class="warn">⚠ You are using the default admin password. Set the ADMIN_PASS environment variable before going live.</div>':'')+
  '<h1>Overview</h1><p class="sub">Social casino — coins are virtual and cannot be cashed out. '+(o.settings.sandbox?'<span class="pill y">SANDBOX PAYMENTS ON</span>':'<span class="pill g">LIVE PAYMENTS</span>')+'</p>'+
  '<div class="kpis">'+k('Revenue (total)','$'+fmt(o.revenue),'$'+fmt(o.revenue24)+' last 24h')+k('Paid orders',int(o.paidOrders),int(o.payers)+' paying players')+k('Players',int(o.players),int(o.active24)+' active · '+int(o.new24)+' new (24h)')+
  k('ARPPU',o.payers?'$'+fmt(o.revenue/o.payers):'—','revenue per paying player')+k('Coins sold',int(o.coinsSold),int(Math.round(o.coinsInWallets))+' in wallets')+k('Spins',int(o.spins),int(o.spins24)+' last 24h')+
  k('Coins wagered',fmt(o.bet,0),fmt(o.bet24,0)+' last 24h')+k('Coins won',fmt(o.win,0),fmt(o.win24,0)+' last 24h')+k('Actual RTP',o.rtp==null?'—':fmt(o.rtp)+'%','target ~96%')+'</div>'+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px"><div class="box"><h2>Revenue per day ($)</h2>'+bars(o.days,'rev','#24d17e',v=>fmt(v,0))+'</div><div class="box"><h2>Active players per day</h2>'+bars(o.days,'active','#4ea8ff',v=>int(v))+'</div><div class="box"><h2>Rounds per day</h2>'+bars(o.days,'rounds','#ffc83d',v=>int(v))+'</div><div class="box"><h2>House result per day (coins)</h2>'+bars(o.days.map(d=>Object.assign({},d,{ggr:Math.max(0,d.bet-d.win)})),'ggr','#c77dff',v=>fmt(v,0))+'</div></div>'+
  '<div class="box"><h2>Top games by coins wagered</h2><table><tr><th>Game</th><th>Type</th><th class="num">Spins</th><th class="num">Wagered</th><th></th><th class="num">RTP actual / target</th></tr>'+
  top.map(g=>'<tr><td>'+esc(g.name)+'</td><td>'+g.label+'</td><td class="num">'+int(g.spins)+'</td><td class="num">'+fmt(g.bet,0)+'</td><td><div class="bar"><i style="width:'+(g.bet/maxB*100)+'%"></i></div></td><td class="num"><span class="'+rtpCls(g.rtp,g.theo)+'">'+(g.rtp==null?'—':fmt(g.rtp)+'%')+'</span> / '+g.theo+'%</td></tr>').join('')+'</table></div>'},
 async games(m){const o=await api('/api/admin/overview');
  m.innerHTML='<h1>Games</h1><p class="sub">'+o.games.length+' machines. Turn games on/off and set lobby badges. RTP is fixed per engine and shown for transparency; small samples swing a lot.</p><div class="box"><table><tr><th>#</th><th>Game</th><th>Engine</th><th>Status</th><th>Badge</th><th class="num">Spins</th><th class="num">Wagered</th><th class="num">Won</th><th class="num">House result</th><th class="num">RTP actual</th><th class="num">Target</th><th class="num">Bonus hits</th></tr>'+
  o.games.map(g=>'<tr><td>'+g.id+'</td><td><b>'+esc(g.name)+'</b></td><td>'+g.label+'</td><td><button class="btn '+(g.enabled?'':'d')+'" data-tog="'+g.id+'" data-v="'+(g.enabled?0:1)+'">'+(g.enabled?'● Live':'○ Off')+'</button></td><td><select data-tag="'+g.id+'"><option value="">—</option><option value="hot"'+(g.tag==='hot'?' selected':'')+'>HOT</option><option value="new"'+(g.tag==='new'?' selected':'')+'>NEW</option></select></td><td class="num">'+int(g.spins)+'</td><td class="num">'+fmt(g.bet,0)+'</td><td class="num">'+fmt(g.win,0)+'</td><td class="num '+(g.ggr>=0?'pos':'neg')+'">'+fmt(g.ggr,0)+'</td><td class="num '+rtpCls(g.rtp,g.theo)+'">'+(g.rtp==null?'—':fmt(g.rtp)+'%')+'</td><td class="num">'+g.theo+'%</td><td class="num">'+int(g.fs)+'</td></tr>').join('')+'</table></div>';
  m.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{await api('/api/admin/games/'+b.dataset.tog,{enabled:b.dataset.v==='1'});render()});
  m.querySelectorAll('[data-tag]').forEach(s=>s.onchange=async()=>{await api('/api/admin/games/'+s.dataset.tag,{tag:s.value});toast('Saved')})},
 async players(m,q){q=q||DR.plq||'';DR.plq='';const o=await api('/api/admin/players?q='+encodeURIComponent(q));
  m.innerHTML='<h1>Players</h1><p class="sub">'+int(o.total)+' players</p><div class="row"><input id="pq" placeholder="Search name or ID" value="'+esc(q)+'"><button class="btn" id="pgo">Search</button><button class="btn" id="pcsv">Export CSV</button></div><div class="box"><table><tr><th>ID</th><th>Name</th><th class="num">Balance</th><th class="num">Spent $</th><th class="num">Orders</th><th class="num">Spins</th><th class="num">Wagered</th><th class="num">Won</th><th class="num">RTP</th><th>Joined</th><th>Last seen</th><th>Status</th><th></th></tr>'+
  o.players.map(p=>'<tr><td>'+p.id+'</td><td><b data-det="'+p.id+'" style="cursor:pointer;text-decoration:underline dotted">'+esc(p.name)+'</b>'+(p.flagged?' <span class="pill r" title="Created on a device with several accounts">MULTI</span>':'')+(p.social?' <span class="pill b">'+p.social+'</span>':'')+(p.email?'<br><small style="color:var(--mute)">'+esc(p.email)+(p.emailVerified?' ✓':'')+'</small>':'')+(p.fs?' <span class="pill b">FS '+p.fs.left+'</span>':'')+'</td><td class="num">'+fmt(p.bal)+'</td><td class="num">'+fmt(p.st.dep)+'</td><td class="num">'+p.st.depCount+'</td><td class="num">'+int(p.st.spins)+'</td><td class="num">'+fmt(p.st.bet,0)+'</td><td class="num">'+fmt(p.st.win,0)+'</td><td class="num">'+(p.st.bet?fmt(p.st.win/p.st.bet*100)+'%':'—')+'</td><td>'+dt(p.created)+'</td><td>'+dt(p.last)+'</td><td>'+(p.banned?'<span class="pill r">Suspended</span>':'<span class="pill g">Active</span>')+'</td><td><button class="btn" data-adj="'+p.id+'" data-n="'+esc(p.name)+'">Adjust coins</button> <button class="btn" data-hist="'+p.id+'">Rounds</button> <button class="btn '+(p.banned?'':'d')+'" data-ban="'+p.id+'" data-v="'+(p.banned?0:1)+'">'+(p.banned?'Unsuspend':'Suspend')+'</button></td></tr>').join('')+'</table></div>';
  $('#pcsv').onclick=()=>csv('players',o.players.map(p=>({id:p.id,name:p.name,balance:p.bal,spent_usd:p.st.dep,orders:p.st.depCount,rounds:p.st.spins,wagered:p.st.bet,won:p.st.win,joined:new Date(p.created).toISOString(),last_seen:new Date(p.last).toISOString(),suspended:!!p.banned})));
  m.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>playerDetail(b.dataset.det));
  const go=()=>R.players(m,$('#pq').value.trim());$('#pgo').onclick=go;$('#pq').onkeydown=e=>{if(e.key==='Enter')go()};
  m.querySelectorAll('[data-ban]').forEach(b=>b.onclick=async()=>{await api('/api/admin/players/'+b.dataset.ban+'/ban',{banned:b.dataset.v==='1'});R.players(m,q)});
  m.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{page='rounds';start();setTimeout(()=>R.rounds($('#main'),b.dataset.hist),0)});
  m.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{$('#mc').innerHTML='<h2>Adjust coins — '+b.dataset.n+'</h2><p class="sub" style="margin:0">Positive adds, negative removes. Every change is logged.</p><input id="aa" type="number" step="0.01" placeholder="Amount e.g. 5000 or -1000"><input id="ar" placeholder="Reason (required)" maxlength="120"><div class="row" style="margin:0"><button class="btn p" id="aok">Apply</button><button class="btn" id="ano">Cancel</button></div>';
   $('#modal').classList.add('show');$('#ano').onclick=()=>$('#modal').classList.remove('show');
   $('#aok').onclick=async()=>{const r=await api('/api/admin/players/'+b.dataset.adj+'/adjust',{amount:+$('#aa').value,reason:$('#ar').value});if(r.ok){$('#modal').classList.remove('show');toast('New balance '+fmt(r.bal));R.players(m,q)}}})},
 async orders(m,st){st=st||'';const o=await api('/api/admin/orders?x=1'+(st?'&status='+st:'')+(DR.o||''));const P={pending:'y',paid:'g',refunded:'r',cancelled:'b'};
  m.innerHTML='<h1>Orders</h1><p class="sub">Coin purchases. Mark offline payments as paid, refund (removes coins) or cancel.</p><div class="row">'+['','pending','paid','refunded','cancelled'].map(s=>'<button class="btn '+(s===st?'p':'')+'" data-st="'+s+'">'+(s||'All')+'</button>').join('')+'<span>From</span><input type="date" id="of" value="'+(DR.of||'')+'"><span>To</span><input type="date" id="ot" value="'+(DR.ot||'')+'"><button class="btn" id="ogo">Apply</button><button class="btn" id="ocsv">Export CSV</button></div><div class="box"><table><tr><th>Order</th><th>Player</th><th>Package</th><th class="num">Price</th><th class="num">Coins</th><th>Provider</th><th>Status</th><th>Created</th><th>Paid</th><th></th></tr>'+
  (o.orders.length?o.orders.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.name)+'</td><td>'+x.pkg+'</td><td class="num">$'+fmt(x.price)+'</td><td class="num">'+int(x.coins)+'</td><td>'+x.provider+'</td><td><span class="pill '+P[x.status]+'">'+x.status+'</span></td><td>'+dt(x.created)+'</td><td>'+dt(x.paidAt)+'</td><td>'+(x.status==='pending'?'<button class="btn p" data-o="'+x.id+'" data-s="paid">Mark paid</button> <button class="btn" data-o="'+x.id+'" data-s="cancelled">Cancel</button>':x.status==='paid'?'<button class="btn d" data-o="'+x.id+'" data-s="refunded">Refund</button>':'')+'</td></tr>').join(''):'<tr><td colspan="10" style="color:var(--mute)">No orders yet.</td></tr>')+'</table></div>';

  k('Conversion',pct(o.conversion),int(o.payers)+' of '+int(o.users)+' players paid')+k('ARPPU','$'+fmt(o.arppu),'per paying player, all time')+k('ARPDAU','$'+fmt(o.arpdau,3),'last 30 days')+k('Revenue 30d','$'+fmt(o.revenue30))+k('Push subscribers',int(o.pushSubs))+'</div>'+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px"><div class="box"><h2>Active players and sign-ups (30 days)</h2>'+lineChart(o.days,['active','signups'],['#4ea8ff','#facc15'],v=>int(v))+'<p class="sub" style="margin:4px 0 0"><span style="color:#4ea8ff">●</span> active <span style="color:#facc15">●</span> sign-ups</p></div><div class="box"><h2>Revenue per day ($)</h2>'+lineChart(o.days,['rev'],['#24d17e'],v=>fmt(v))+'</div></div>'+
  '<div class="box"><h2>Retention by sign-up day</h2><p class="sub" style="margin:0 0 8px">Share of each day\'s new players who came back on day 1, 7 and 30.</p><table><tr><th>Sign-up day</th><th class="num">New players</th><th class="num">Day 1</th><th class="num">Day 7</th><th class="num">Day 30</th></tr>'+(o.cohorts.length?o.cohorts.slice().reverse().map(c=>'<tr><td>'+c.day+'</td><td class="num">'+int(c.size)+'</td>'+rc(c.d1)+rc(c.d7)+rc(c.d30)+'</tr>').join(''):'<tr><td colspan="5" style="color:var(--mute)">No sign-ups yet.</td></tr>')+'</table></div>'+
  '<div class="box"><h2>Games by players (30 days)</h2><table><tr><th>Game</th><th class="num">Players</th><th class="num">Rounds</th><th class="num">Play time</th><th class="num">Avg min / player</th></tr>'+(o.games.length?o.games.slice(0,40).map(g=>'<tr><td>'+esc(g.name)+'</td><td class="num">'+int(g.players)+'</td><td class="num">'+int(g.rounds)+'</td><td class="num">'+fmt(g.secs/3600,1)+' h</td><td class="num">'+fmt(g.avgMin,1)+'</td></tr>').join(''):'<tr><td colspan="5" style="color:var(--mute)">No play yet.</td></tr>')+'</table></div>'},
 async campaigns(m){
  m.innerHTML='<h1>Campaigns</h1><p class="sub">Send a message and/or gift coins to a group of players. Messages appear in the in-app bell; tick push to also notify phones that turned notifications on.</p><div class="box"><div class="form">'+
  '<label>Audience</label><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="ca"><option value="all">All players</option><option value="active">Active in the last N days</option><option value="inactive">Inactive for N days (win-back)</option><option value="level">Level at least N</option><option value="payers">Paying players</option><option value="nonpayers">Never paid</option><option value="user">One player (ID)</option></select><input id="cn" type="number" placeholder="N / player ID" style="width:140px"><button class="btn" id="cprev">Count</button><span id="ccount" class="sub" style="margin:0;align-self:center"></span></div>'+
  '<label>Title</label><input id="ct" maxlength="80" placeholder="e.g. Weekend gift!">'+
  '<label>Message</label><textarea id="cm" rows="3" maxlength="300" placeholder="Shown under the title"></textarea>'+
  '<label>Gift coins (each)</label><input id="cc" type="number" placeholder="0 for message only">'+
  '<label>Push notification</label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cp" checked style="width:auto"> Also send push</label>'+
  '<span></span><div><button class="btn p" id="csend">Send campaign</button></div></div></div>';
  const aud=()=>{const t=$('#ca').value,n=+$('#cn').value;return t==='user'?{type:t,id:n}:{type:t,days:n||7,min:n||1}};
  $('#cprev').onclick=async()=>{const r=await api('/api/admin/campaign/preview',{audience:aud()});$('#ccount').textContent=int(r.count)+' players'};
  $('#csend').onclick=async()=>{const r0=await api('/api/admin/campaign/preview',{audience:aud()});if(!confirm('Send to '+r0.count+' players'+(+$('#cc').value?' with '+$('#cc').value+' coins each':'')+'?'))return;
   const r=await api('/api/admin/campaign',{audience:aud(),title:$('#ct').value,message:$('#cm').value,coins:+$('#cc').value||0,push:$('#cp').checked});if(r.players)toast('Sent to '+r.players+' players'+(r.pushed?' · '+r.pushed+' push':''))}},
 async tournaments(m){const o=await api('/api/admin/tournaments');const now=Date.now();
  const st=t=>t.paid?'<span class="pill b">paid out</span>':t.start>now?'<span class="pill y">scheduled</span>':t.end>now?'<span class="pill g">live</span>':'<span class="pill y">paying…</span>';
  m.innerHTML='<h1>Tournaments</h1><p class="sub">Timed competitions with coin prizes, paid automatically within a minute of the end. The weekly leaderboard (top 10, total won) runs on its own every Monday.</p>'+
  '<div class="box"><h2>New tournament</h2><div class="form"><label>Name</label><input id="tn" placeholder="e.g. Friday Night Slots">'+
  '<label>Start / end</label><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="ts" type="datetime-local" value="'+toLocal(now+36e5)+'"><input id="te" type="datetime-local" value="'+toLocal(now+36e5+864e5)+'"></div>'+
  '<label>Ranking</label><select id="tm"><option value="won">Most coins won</option><option value="mult">Biggest single-win multiplier</option><option value="rounds">Most rounds played</option></select>'+
  '<label>Games</label><select id="tf"><option value="all">All games</option><option value="slots">All slots</option><option value="tables">Table games</option>'+['tumble','cluster','lines','ways','classic3','holdwin'].map(e=>'<option value="engine:'+e+'">'+e+' slots</option>').join('')+'</select>'+
  '<label>Minimum bet</label><input id="tb" type="number" value="0">'+
  '<label>Prizes (coins, 1st, 2nd …)</label><input id="tp" placeholder="20000, 10000, 5000, 2500, 1000" value="20000, 10000, 5000, 2500, 1000">'+
  '<span></span><div><button class="btn p" id="tgo">Create</button></div></div></div>'+
  '<div class="box"><table><tr><th>Name</th><th>Status</th><th>Start</th><th>End</th><th>Ranking</th><th>Games</th><th>Prizes</th><th>Leader</th><th></th></tr>'+(o.tournaments.length?o.tournaments.map(t=>'<tr><td><b>'+esc(t.name)+'</b></td><td>'+st(t)+'</td><td>'+dt(t.start)+'</td><td>'+dt(t.end)+'</td><td>'+t.metric+'</td><td>'+t.filter+'</td><td>'+t.prizes.map(int).join(' / ')+'</td><td>'+(t.top[0]?esc(t.top[0].name)+' ('+fmt(t.top[0].score)+')':'—')+'</td><td>'+(t.start>now?'<button class="btn d" data-del="'+t.id+'">Delete</button>':'')+'</td></tr>').join(''):'<tr><td colspan="9" style="color:var(--mute)">None yet.</td></tr>')+'</table></div>';
  $('#tgo').onclick=async()=>{const r=await api('/api/admin/tournaments',{name:$('#tn').value,start:new Date($('#ts').value).getTime(),end:new Date($('#te').value).getTime(),metric:$('#tm').value,filter:$('#tf').value,minBet:+$('#tb').value,prizes:$('#tp').value});if(r.tournament){toast('Created');R.tournaments(m)}};
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this tournament?'))return;await api('/api/admin/tournaments/'+b.dataset.del+'/delete',{});R.tournaments(m)})},
 async risk(m){const o=await api('/api/admin/risk');
  m.innerHTML='<h1>Risk</h1><p class="sub">Possible multi-accounting. A device that opens many accounts only gets the welcome bonus for the first few (Settings). One daily reward per device per day. Review before suspending: families can share a device or Wi-Fi.</p>'+
  '<div class="box"><h2>Devices with several accounts</h2><table><tr><th>Device</th><th class="num">Accounts</th><th>Last IP</th><th>Last seen</th></tr>'+(o.devices.length?o.devices.map(d=>'<tr><td><code>'+esc(String(d.fp).slice(0,16))+'…</code></td><td class="num">'+d.accounts+'</td><td>'+esc(d.ip||'')+'</td><td>'+dt(d.last)+'</td></tr>').join(''):'<tr><td colspan="4" style="color:var(--mute)">Nothing suspicious.</td></tr>')+'</table></div>'+
  '<div class="box"><h2>Networks (IP) with many accounts</h2><table><tr><th>IP</th><th class="num">Accounts</th><th>Last seen</th></tr>'+(o.ips.length?o.ips.map(d=>'<tr><td>'+esc(d.ip)+'</td><td class="num">'+d.accounts+'</td><td>'+dt(d.last)+'</td></tr>').join(''):'<tr><td colspan="3" style="color:var(--mute)">Nothing suspicious.</td></tr>')+'</table></div>'+
  '<div class="box"><h2>Flagged accounts</h2>'+(o.flagged.length?o.flagged.map(u=>'<button class="btn" data-det="'+u.id+'">'+esc(u.name)+' #'+u.id+'</button>').join(' '):'<p class="sub" style="margin:0">None.</p>')+'</div>';
  m.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>playerDetail(b.dataset.det))},
 async system(m){const o=await api('/api/admin/system');const al=(await api('/api/admin/alerts')).alerts||[];const h=o.health,c=o.config;const yes=v=>v?'<span class="pill g">configured</span>':'<span class="pill y">not set</span>';
  m.innerHTML='<h1>System</h1><p class="sub">Health, configuration and logs. Uptime monitors can poll <code>/api/health</code>.</p><div class="box"><h2>告警 Alerts</h2>'+(al.length?'<table>'+al.slice(0,15).map(x=>'<tr><td>'+dt(x.t)+'</td><td>'+esc(x.text)+'</td></tr>').join('')+'</table>':'<p class="sub">No alerts since the server started. Set ALERT_WEBHOOK (Slack/Discord/Teams) or ALERT_EMAIL to be notified.</p>')+'</div><div class="kpis">'+
  '<div class="kpi"><small>Status</small><b>'+(h.ok?'🟢 OK':'🔴 DOWN')+'</b><span>'+c.db+' database · Node '+esc(c.node)+'</span></div><div class="kpi"><small>Uptime</small><b>'+fmt(h.uptime/3600,1)+' h</b></div><div class="kpi"><small>Errors (24h)</small><b>'+int(h.errors24h)+'</b></div><div class="kpi"><small>Memory</small><b>'+esc(h.mem)+'</b></div></div>'+
  '<div class="box"><h2>Integrations</h2><table>'+[['Email (Resend / SendGrid)',c.mail,'MAIL_PROVIDER, MAIL_API_KEY, MAIL_FROM'],['SMS (Twilio)',c.sms,'TWILIO_SID, TWILIO_TOKEN, TWILIO_FROM'],['Sign in with Google',c.google,'GOOGLE_CLIENT_ID'],['Sign in with Apple',c.apple,'APPLE_CLIENT_ID'],['Alerts webhook (Slack/Discord/Teams)',c.alerts,'ALERT_WEBHOOK'],['Public URL',!!c.publicUrl,'PUBLIC_URL']].map(r=>'<tr><td>'+r[0]+'</td><td>'+yes(r[1])+'</td><td><code>'+r[2]+'</code></td></tr>').join('')+'</table><div class="row" style="margin-top:10px"><button class="btn" id="talert">Send test alert</button></div></div>'+
  '<div class="box"><h2>Outgoing email and SMS</h2><p class="sub" style="margin:0 0 8px">Without a provider, messages are not delivered; they are kept here so you can test sign-up and password reset.</p><table><tr><th>Time</th><th>Channel</th><th>To</th><th>Subject / text</th><th>Status</th></tr>'+(o.outbox.length?o.outbox.map(x=>'<tr><td>'+dt(Number(x.t))+'</td><td>'+x.channel+'</td><td>'+esc(x.dest)+'</td><td style="white-space:normal">'+esc(x.subject||'')+'</td><td>'+esc(x.status)+'</td></tr>').join(''):'<tr><td colspan="5" style="color:var(--mute)">Empty.</td></tr>')+'</table></div>'+
  '<div class="box"><h2>Server errors</h2><table><tr><th>Time</th><th>Where</th><th>Message</th></tr>'+(o.errors.length?o.errors.map(e=>'<tr><td>'+dt(Number(e.t))+'</td><td>'+esc(e.ctx||'')+'</td><td style="white-space:normal" title="'+esc(e.stack||'')+'">'+esc(e.msg)+'</td></tr>').join(''):'<tr><td colspan="3" style="color:var(--mute)">No errors. 🎉</td></tr>')+'</table></div>';
  $('#talert').onclick=async()=>{const r=await api('/api/admin/test-alert',{});toast(r.configured?'Test alert sent':'ALERT_WEBHOOK is not set — alert printed in the server console only')}}
});
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
if(TOKEN)api('/api/admin/overview').then(()=>start()).catch(()=>{});else logout();
</script>
