<!DOCTYPE html>
<html lang="zh" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · VANTAX GAMES</title>
<meta name="description" content="VANTAX GAMES (Wantai Game Development) official hub for games. Hero Defense and LuckyVault are available now. VANTAX POKER is coming soon.">
<meta property="og:title" content="VANTAX GAMES">
<meta property="og:description" content="Official hub for VANTAX GAMES. Play Hero Defense and LuckyVault now. VANTAX POKER is coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vantaxgame.com/">
<meta name="theme-color" content="#0a1016">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-vantax.png">
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #0a1016;
  --bg-2: #101820;
  --surface: #16202b;
  --ink: #f3f6f8;
  --muted: #9aa8b5;
  --line: rgba(94, 234, 212, .2);
  --accent: #5eead4;
  --accent-2: #99f6e4;
  --accent-dim: rgba(94, 234, 212, .1);
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(900px 480px at 12% -10%, rgba(94, 234, 212, .09), transparent 60%),
    radial-gradient(700px 420px at 100% 0%, rgba(56, 132, 180, .12), transparent 55%),
    var(--bg);
  color: var(--ink);
  font: 17px/1.65 var(--sans);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
::selection { background: rgba(94, 234, 212, .28); color: #fff; }
.wrap { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
h1, h2, h3, p { text-wrap: pretty; }
h1, h2, h3 { margin: 0; letter-spacing: -0.03em; line-height: 1.12; font-weight: 650; }
h1 { font-size: clamp(40px, 7vw, 80px); }
h2 { font-size: clamp(26px, 3.2vw, 40px); }

header {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(16px);
  background: rgba(10, 16, 22, .84);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.bar {
  height: 72px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-right: auto;
  text-decoration: none;
  min-width: 0;
}
.brand svg { width: 36px; height: 36px; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-en { font-weight: 700; letter-spacing: .08em; font-size: 13px; }
.brand-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
.lang {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  background: rgba(255,255,255,.03);
}
.lang button {
  padding: 6px 12px;
  border-radius: 999px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}
.lang button[aria-pressed="true"] {
  background: var(--accent-dim);
  color: var(--accent-2);
}

.hero { padding: 88px 0 36px; }
.eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 18px;
  color: var(--accent-2);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
}
.eyebrow:before {
  content: "";
  width: 28px;
  height: 1px;
  background: var(--accent);
  flex: none;
}
html[lang="zh"] .eyebrow { letter-spacing: .12em; text-transform: none; font-size: 14px; }
.hero-zh {
  margin-top: 10px;
  font-size: clamp(20px, 3vw, 30px);
  font-weight: 560;
  letter-spacing: 0.12em;
  color: var(--accent-2);
}
.sub { color: var(--muted); max-width: 36em; margin: 22px 0 0; font-size: 18px; }

section { padding: 28px 0 16px; }
section.sites { padding-bottom: 72px; }
.lead { color: var(--muted); margin: 12px 0 28px; }

.game-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
@media (max-width: 1100px) {
  .game-grid { grid-template-columns: repeat(2, 1fr); }
}
.game-card {
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,.22);
  text-decoration: none;
  color: inherit;
  min-width: 0;
  transition: border-color .2s ease, transform .2s ease;
}
a.game-card:hover {
  border-color: rgba(94, 234, 212, .45);
  transform: translateY(-2px);
}
.game-card.is-soon { cursor: default; }
.shot {
  aspect-ratio: 1600 / 736;
  background: #0d151c;
  overflow: hidden;
}
.shot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.shot.fit-contain { background: #05070a; }
.shot.fit-contain img { object-fit: contain; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.badges .status { margin: 0; }
.age {
  display: inline-flex;
  align-items: center;
  padding: 5px 9px;
  border-radius: 999px;
  border: 1px solid rgba(255, 196, 120, .4);
  color: #ffd7a1;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
}
.note { margin: 10px 0 0; color: #d5dde4; font-size: 13px; line-height: 1.55; }
.art {
  aspect-ratio: 1600 / 736;
  display: grid;
  place-items: center;
  background:
    radial-gradient(160px 100px at 30% 30%, rgba(94,234,212,.16), transparent 70%),
    var(--surface);
}
.body { padding: 22px 24px 26px; display: flex; flex-direction: column; flex: 1; }
.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 12px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--accent-dim);
  color: var(--accent-2);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  width: max-content;
}
.status i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(94,234,212,.15);
  font-style: normal;
}
.status.soon {
  background: rgba(255,255,255,.05);
  color: #d5dde4;
}
.status.soon i {
  background: #8b98a4;
  box-shadow: none;
}
.logo-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 8px;
}
.logo-row img.icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  flex: none;
}
.logo-full {
  height: 42px;
  width: auto;
  max-width: min(260px, 70%);
  object-fit: contain;
}
h3 { font-size: clamp(24px, 2.4vw, 30px); }
.en-name {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.desc { margin: 14px 0 0; color: var(--muted); }
.cta {
  margin-top: 18px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--accent-2);
  font-weight: 700;
  font-size: 15px;
}
.cta:after { content: "→"; }

footer {
  border-top: 1px solid rgba(255,255,255,.06);
  padding: 28px 0 40px;
  color: var(--muted);
  font-size: 13px;
}
.foot {
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 18px 32px;
  flex-wrap: wrap;
}
.foot a { color: var(--accent-2); text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.links { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; }

.lang-en, .lang-zh { display: none !important; }
html[lang="en"] .lang-en, html[lang="zh"] .lang-zh { display: revert !important; }
html[lang="en"] img.lang-en, html[lang="zh"] img.lang-zh { display: block !important; }

@media (max-width: 860px) {
  .game-grid { grid-template-columns: 1fr; }
  .hero { padding-top: 56px; }
  .links { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  a.game-card:hover { transform: none; }
}

.notfound{min-height:calc(100vh - 72px);display:grid;align-content:center;padding:80px 0}.notfound a{display:inline-block;margin-top:28px;color:var(--accent-2);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
</style>
<script>

(function () {
  var l = null;
  try { l = localStorage.getItem("vantax_lang"); } catch (e) {}
  if (l !== "en" && l !== "zh") {
    var nav = navigator.language || (navigator.languages && navigator.languages[0]) || "";
    l = /^zh/i.test(nav) ? "zh" : "en";
  }
  document.documentElement.lang = l;
  document.documentElement.setAttribute("data-lang", l);
  if (l === "en") document.title = "VANTAX GAMES";
})();

</script>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true">
  <rect width="32" height="32" rx="8" fill="#12202c"/>
  <rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="rgba(94,234,212,.35)"/>
  <path d="M7.5 8.2h5.15L16 20.4 19.35 8.2h5.15L16.7 24.2h-1.4L7.5 8.2z" fill="#5eead4"/>
</svg>

      <span class="brand-text">
        <span class="brand-en">VANTAX GAMES</span>
        <span class="brand-sub lang-zh">万泰游戏开发</span>
        <span class="brand-sub lang-en">Wantai Game Development</span>
      </span>
    </a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中</button>
        <button type="button" data-lang="en">EN</button>
      </div>

  </div>
</header>


<main class="wrap notfound">
  <p class="eyebrow">404</p>
  <h1><span class="lang-zh">页面不存在</span><span class="lang-en">Page not found</span></h1>
  <p class="sub"><span class="lang-zh">你要找的页面不存在或已移动。</span><span class="lang-en">The page you are looking for doesn't exist or has moved.</span></p>
  <p><a href="/"><span class="lang-zh">返回 VANTAX GAMES 首页</span><span class="lang-en">Back to VANTAX GAMES</span></a></p>
</main>
<script>

(function () {
  var KEY = "vantax_lang";
  var root = document.documentElement;
  var titles = {
    en: "VANTAX GAMES",
    zh: "万泰游戏 · VANTAX GAMES"
  };
  function apply(lang) {
    lang = lang === "zh" ? "zh" : "en";
    root.lang = lang;
    root.setAttribute("data-lang", lang);
    document.title = titles[lang];
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    var buttons = document.querySelectorAll(".lang button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute("data-lang") === lang ? "true" : "false");
    }
  }
  var start = null;
  try { start = localStorage.getItem(KEY); } catch (e) {}
  if (start !== "en" && start !== "zh") {
    var nav = navigator.language || (navigator.languages && navigator.languages[0]) || "";
    start = /^zh/i.test(nav) ? "zh" : "en";
  }
  apply(start);
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest(".lang button");
    if (btn) apply(btn.getAttribute("data-lang"));
  });
})();

</script>
</body>
</html>
