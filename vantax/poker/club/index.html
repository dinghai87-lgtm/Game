<style>
:root{
  --bg:#0a0a0c; --panel:#141418; --panel2:#1b1b21; --line:#2a2a33; --txt:#ece7dc; --mute:#9a958a;
  --gold:#d4ac55; --gold2:#f3d68a; --red:#c2183a; --green:#1f8a4c; --felt:#0e4a33; --felt2:#0a3324;
  --blue:#3b82f6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--gold2)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(#000,#0d0d10);border-bottom:1px solid #3a3020}
.logo{display:flex;align-items:center;gap:10px;font-family:Cinzel,serif;font-weight:800;letter-spacing:.06em;color:var(--gold2);font-size:18px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e2a4,#b8862f 60%,#6b4b14);display:grid;place-items:center;color:#1a1206;font-size:18px;box-shadow:0 0 0 2px #000,0 0 0 3px #b8862f}
.logo small{display:block;font-family:"Noto Sans SC";font-weight:500;font-size:11px;color:var(--mute);letter-spacing:.2em}
nav{display:flex;gap:4px;flex:1;overflow:auto}
nav button{background:none;border:0;color:var(--mute);padding:8px 12px;border-radius:8px;white-space:nowrap}
nav button.on{color:#000;background:var(--gold)}
nav button:hover:not(.on){color:var(--txt);background:#ffffff10}
.wallet{display:flex;align-items:center;gap:8px;background:#000;border:1px solid #3a3020;border-radius:999px;padding:4px 4px 4px 12px;white-space:nowrap}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffeaa8,#d39b2a 65%,#7a5310);vertical-align:-2px;box-shadow:inset 0 0 0 2px #e9be5c}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px 14px;border-radius:8px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.gold{background:linear-gradient(#f0cf7a,#c4963f);color:#1a1206;border-color:#e3bd63;font-weight:700}
.btn.red{background:linear-gradient(#d4284a,#9b0f2a);border-color:#e0405e;color:#fff;font-weight:700}
.btn.green{background:linear-gradient(#27a35c,#17703e);border-color:#36b46b;color:#fff;font-weight:700}
.btn.sm{padding:5px 10px;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#ffffff12;color:var(--mute)}
.pill.live{background:#c2183a33;color:#ff6b86}
.pill.ok{background:#1f8a4c33;color:#5fe39a}
.pill.gold{background:#d4ac5530;color:var(--gold2)}
main{max-width:1280px;margin:0 auto;padding:18px}
.hero{position:relative;border-radius:16px;overflow:hidden;padding:34px 30px;margin-bottom:20px;background:
  radial-gradient(ellipse at 80% 20%,#c2183a55,transparent 55%),radial-gradient(ellipse at 10% 90%,#d4ac5533,transparent 50%),linear-gradient(135deg,#17110a,#0b0b0d 60%);border:1px solid #3a3020}
.hero h1{font-family:Cinzel,"Noto Sans SC",serif;margin:0 0 6px;font-size:30px;color:var(--gold2);letter-spacing:.04em}
.hero p{margin:0;color:var(--mute);max-width:640px;line-height:1.7}
.hero .suits{display:none;position:absolute;right:24px;top:10px;font-size:110px;opacity:.07;letter-spacing:-10px;pointer-events:none}
.hero .rules{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
h2.sec{font-family:Cinzel,"Noto Sans SC",serif;color:var(--gold2);font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#3a3020,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card-t{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.card-t:hover{border-color:#5a4a2a}
.card-t .ttl{font-weight:700;font-size:16px}
.card-t .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:13px}
.card-t .meta b{color:var(--txt);font-weight:600}
.card-t .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.card-t .band{position:absolute;right:-30px;top:12px;transform:rotate(35deg);background:var(--red);color:#fff;font-size:11px;padding:2px 34px;font-weight:700}
.empty{color:var(--mute);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th,table.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.list th{color:var(--mute);font-weight:500;font-size:12px}
table.list td.num,table.list th.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:#5fe39a}.neg{color:#ff6b86}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input,select{background:#0c0c0f;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
/* ---------- table view ---------- */
.tv{display:grid;grid-template-columns:1fr 280px;gap:14px}
@media(max-width:980px){.tv{grid-template-columns:1fr}}
.tv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tv-head .nm{font-weight:900;font-size:18px}
.felt-wrap{position:relative;width:100%;aspect-ratio:16/10;max-height:72vh}
@media(max-width:640px){.felt-wrap{aspect-ratio:3/4}}
.felt{position:absolute;inset:7% 9%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#16704d,var(--felt) 45%,var(--felt2) 100%);
  box-shadow:0 0 0 10px #2a1a0c,0 0 0 13px #b8862f,0 0 0 15px #3b2610,0 20px 60px #000c, inset 0 0 60px #0008}
.felt .brand{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:Cinzel,serif;font-weight:800;color:#ffffff14;font-size:clamp(14px,2.4vw,26px);letter-spacing:.2em;white-space:nowrap}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:70%}
.board{display:flex;gap:6px;min-height:calc(var(--cw)*1.4)}
.pot{background:#000a;border:1px solid #d4ac5566;color:var(--gold2);padding:3px 12px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.result{background:#000c;border:1px solid var(--gold);color:var(--gold2);padding:6px 12px;border-radius:10px;font-size:13px;text-align:center;max-width:100%}
.felt-wrap{--cw:clamp(30px,4.4vw,52px)}
.pc{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.12);background:linear-gradient(#fff,#ececec);color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;line-height:1;box-shadow:0 2px 6px #0008;position:relative;font-family:Georgia,serif;user-select:none}
.pc .r{font-size:calc(var(--cw)*.46)}
.pc .s{font-size:calc(var(--cw)*.44)}

<script>
/* ===== 万泰扑克 · 牌局引擎（纯逻辑，无 DOM） ===== */
(function (G) {

  const SNG_LEVELS = [
    [10, 20, 0], [15, 30, 0], [25, 50, 0], [50, 100, 0], [75, 150, 0], [100, 200, 25],
    [150, 300, 25], [200, 400, 50], [300, 600, 75], [400, 800, 100], [600, 1200, 150],

  /* ---------- 牌力评估 ---------- */
  function eval5(cs) {

    }

    else if (cnt[groups[0]] === 4) { cat = 7; k = groups; }
    else if (cnt[groups[0]] === 3 && cnt[groups[1]] === 2) { cat = 6; k = groups; }
    else if (flush) { cat = 5; k = v; }
    else if (st) { cat = 4; k = [st]; }
    else if (cnt[groups[0]] === 3) { cat = 3; k = groups; }
    else if (cnt[groups[0]] === 2 && cnt[groups[1]] === 2) { cat = 2; k = groups; }
    else if (cnt[groups[0]] === 2) { cat = 1; k = groups; }

        if (s > best) { best = s; bc = h; }

  function createTable(cfg) {

      t.bombNext = false; t.bombHand = true; t.sbI = -1; t.bbI = -1; t.stI = -1;
      const a = t.bb * (t.bombBB || 2);
      el.forEach(i => { const s = S(t, i); const x = Math.min(a, s.stack); s.stack -= x; s.total += x; if (!s.stack) s.allIn = true; s.vpip = true; });
      let q = nextIdx(t, t.button, inHand(t));
      for (let r = 0; r < holeN(t); r++) for (let k = 0; k < el.length; k++) {
        (t.priv.hole[q] = t.priv.hole[q] || []).push(t.priv.deck.pop());
        q = nextIdx(t, q, inHand(t));
      }
      t.street = 'preflop'; t.currentBet = 0; t.minRaise = t.bb;
      log(t, `—— 第 ${t.handNo} 手 · 💣 炸弹锅：每人 ${a} 进底池，直接发翻牌 ——`);
      nextStreet(t, now);
      return true;
    }
    if (t.ante) el.forEach(i => { const s = S(t, i); const a = Math.min(t.ante, s.stack); s.stack -= a; s.total += a; if (!s.stack) s.allIn = true; });
    const sbS = S(t, sbI), bbS = S(t, bbI);
    if (!sbS.allIn) pay(sbS, t.sb); sbS.last = '小盲 ' + sbS.bet;
    if (!bbS.allIn) pay(bbS, t.bb); bbS.last = '大盲 ' + bbS.bet;
    t.currentBet = t.bb; t.minRaise = t.bb; t.stI = -1;
    let first = bbI;
    // 现金桌新入座玩家补一个大盲（已在盲注位的免补）
    if (t.kind === 'cash') el.forEach(i => { const s = S(t, i); if (!s.newPost) return; s.newPost = false; if (i === sbI || i === bbI || hu) return; pay(s, t.bb); s.last = '补盲 ' + s.bet; });
    // 抢跑盲 Straddle（现金桌、4 人以上、枪口位玩家自愿开启）
    if (t.kind === 'cash' && el.length >= 4) {
      const ug = nextIdx(t, bbI, inHand(t)), us = S(t, ug);
      if (us.straddle && us.stack > t.bb * 2) { pay(us, t.bb * 2); us.last = '抢跑 ' + us.bet; t.currentBet = t.bb * 2; t.minRaise = t.bb * 2; t.stI = ug; first = ug; }
    }
    let p = sbI;
    for (let r = 0; r < holeN(t); r++) for (let k = 0; k < el.length; k++) {
      (t.priv.hole[p] = t.priv.hole[p] || []).push(t.priv.deck.pop());
      p = nextIdx(t, p, inHand(t));
    }
    t.street = 'preflop';
    log(t, `—— 第 ${t.handNo} 手 · 盲注 ${t.sb}/${t.bb}${t.ante ? ' 前注 ' + t.ante : ''} ——`);
    t.toAct = first; // advance 从大盲（或抢跑位）之后找第一个需要行动的人
    advance(t, now, true);
    return true;
  }

  function legal(t, i) {
    const s = S(t, i);
    const toCall = Math.max(0, Math.min(t.currentBet - s.bet, s.stack));
    let maxTo = s.bet + s.stack;
    // 底池限注：最多加到 当前注 + 跟注后底池
    if (isPLO(t)) maxTo = Math.min(maxTo, t.currentBet + potSize(t) + toCall);
    const others = t.seats.some((o, j) => j !== i && canAct(t, j));
    // TDA：未满额的全下不重新开放加注，已行动过的玩家只能跟或弃
    const canRaise = maxTo > t.currentBet && others && !(s.acted && t.currentBet > s.bet);
    const minTo = Math.min(t.currentBet + t.minRaise, maxTo);
    return { toCall, canCheck: t.currentBet <= s.bet, maxTo, minTo, canRaise, pot: potSize(t) };
  }

  function bombNext(t, on) { if (t.kind !== 'cash') return false; t.bombNext = on !== false; return true; }
  function act(t, i, a, amt, now, auto) {
    if (!['preflop', 'flop', 'turn', 'river'].includes(t.street) || t.toAct !== i) return { ok: false, err: '还没轮到你' };
    const s = S(t, i), L = legal(t, i);
    if (a === 'call' && L.canCheck) a = 'check';
    if (a === 'allin' && L.maxTo <= t.currentBet) a = 'call';
    if (a === 'fold') { s.folded = true; s.last = '弃牌'; }
    else if (a === 'check') { if (!L.canCheck) return { ok: false, err: '需要跟注' }; s.last = '过牌'; }
    else if (a === 'call') { pay(s, L.toCall); s.last = s.allIn ? '全下 ' + s.bet : '跟注 ' + s.bet; }
    else if (a === 'raise' || a === 'allin') {
      if (!L.canRaise) return { ok: false, err: '不能加注' };
      let to = a === 'allin' ? L.maxTo : Math.floor(+amt || 0);
      if (to > L.maxTo) to = L.maxTo;
      if (to < L.minTo) return { ok: false, err: '最少加注到 ' + L.minTo };
      const prev = t.currentBet;
      const full = to - prev >= t.minRaise;
      if (full) t.minRaise = to - prev;
      pay(s, to - s.bet);
      t.currentBet = Math.max(prev, s.bet);
      if (full) t.seats.forEach((o, j) => { if (o && j !== i) o.acted = false; });
      s.last = s.allIn ? '全下 ' + s.bet : (prev === 0 ? '下注 ' : '加注到 ') + s.bet;
    } else return { ok: false, err: '未知操作' };
    if (t.street === 'preflop' && (a === 'call' || a === 'raise' || a === 'allin')) { s.vpip = true; if (a !== 'call') s.pfr = true; }
    s.acted = true;
    if (s.bankOn) { s.bank = Math.max(0, Math.round(s.bank - (now - s.bankStart) / 1000)); s.bankOn = false; }
    if (!auto) s.timeouts = 0;
    log(t, `${label(t, i)} ${s.last}`);
    advance(t, now);
    return { ok: true };
  }

  function advance(t, now, fromStart) {
    const al = alive(t);
    if (al.length === 1) return winByFold(t, al[0], now);
    const actors = t.seats.map((s, i) => canAct(t, i) ? i : -1).filter(i => i >= 0);
    let need = actors.filter(i => !S(t, i).acted || S(t, i).bet < t.currentBet);
    if (actors.length <= 1 && need.every(i => S(t, i).bet >= t.currentBet)) need = [];
    if (need.length) {
      t.toAct = nextIdx(t, t.toAct, i => need.includes(i));
      setDeadline(t, now);
      return;
    }
    nextStreet(t, now);
  }

  function nextStreet(t, now) {
    t.seats.forEach(s => { if (s) { s.bet = 0; s.acted = false; if (s.inHand && !s.folded && !s.allIn) s.last = ''; } });
    t.currentBet = 0; t.minRaise = t.bb;
    const d = t.priv.deck;
    if (t.street === 'river') {
      // 发两次：第一块公共牌发完后，用剩下的牌把第二块补齐（逐街慢发）
      if (t.rit && (!t.board2 || t.board2.length < 5)) {
        if (!t.board2) t.board2 = t.board.slice(0, t.rit.base);
        d.pop();
        if (t.board2.length === 0) t.board2.push(d.pop(), d.pop(), d.pop()); else t.board2.push(d.pop());
        log(t, `第二次发牌：${t.board2.join(' ')}`);
        t.equity = t.board2.length < 5 ? equity(t, t.board2) : null;
        t.runoutAt = now + (t.board2.length < 5 ? 1800 : 1200);
        return;
      }
      return showdown(t, now);
    }
    d.pop(); // 烧牌
    if (t.street === 'preflop') { t.board.push(d.pop(), d.pop(), d.pop()); t.street = 'flop'; }
    else if (t.street === 'flop') { t.board.push(d.pop()); t.street = 'turn'; }
    else if (t.street === 'turn') { t.board.push(d.pop()); t.street = 'river'; }
    log(t, `${{ flop: '翻牌', turn: '转牌', river: '河牌' }[t.street]}：${t.board.join(' ')}`);
    const actors = t.seats.map((s, i) => canAct(t, i) ? i : -1).filter(i => i >= 0);
    if (actors.length <= 1) { // 全下：亮牌，逐街慢发并显示胜率
      alive(t).forEach(i => S(t, i).shown = t.priv.hole[i]);
      const base = Math.max(0, t.board.length - (t.street === 'flop' ? 3 : 1));
      if (!t.rit && t.kind === 'cash' && alive(t).length >= 2 && alive(t).every(i => S(t, i).rit)) {
        t.rit = { base };
        log(t, '所有全下玩家都开启了「发两次」：剩余公共牌发两次，每个底池各分一半');
      }
      t.toAct = -1; t.deadline = 0; t.runoutAt = now + 1800;
      t.equity = equity(t);
      return;
    }
    t.toAct = nextIdx(t, t.button, i => canAct(t, i));
    setDeadline(t, now);
  }

  function runoutStep(t, now) {
    if (!t.runoutAt || now < t.runoutAt) return false;
    t.runoutAt = 0;
    nextStreet(t, now);
    return true;
  }
  /* 胜率：剩余公共牌枚举/蒙特卡洛 */
  function equity(t, board0) {
    const al = alive(t); if (al.length < 2) return null;
    const B = board0 || t.board;
    const used = new Set(t.board.concat(t.board2 || [])); al.forEach(i => t.priv.hole[i].forEach(c => used.add(c)));
    const rest = newDeck().filter(c => !used.has(c));
    const need = 5 - B.length;
    const win = {}; al.forEach(i => win[i] = 0);
    let n = 0;
    const run = extra => {
      const b = B.concat(extra);
      let best = -1, ws = [];
      al.forEach(i => { const s = handEval(t, t.priv.hole[i], b).score; if (s > best) { best = s; ws = [i]; } else if (s === best) ws.push(i); });
      ws.forEach(i => win[i] += 1 / ws.length); n++;
    };
    if (need === 0) run([]);
    else if (need === 1) rest.forEach(c => run([c]));
    else if (need === 2) { for (let a = 0; a < rest.length; a++) for (let b = a + 1; b < rest.length; b++) run([rest[a], rest[b]]); }
    else { for (let k = 0; k < 600; k++) { const d = shuffle(rest); run(d.slice(0, need)); } }
    const o = {}; al.forEach(i => o[i] = Math.round(win[i] / n * 1000) / 10); return o;
  }
  function winByFold(t, w, now) {
    const pot = potSize(t);
    S(t, w).stack += pot;
    t.result = { pots: [{ amount: pot, winners: [w], hand: '' }], fold: true };
    log(t, `${label(t, w)} 赢得底池 ${pot}`);
    t.sdWin = null;
    if (sevenDeuce(t, w)) { S(t, w).shown = t.priv.hole[w]; t.result.sd = t.sdWin; }
    finishHand(t, now, 2500);
  }

  function showdown(t, now) {
    t.street = 'showdown'; t.toAct = -1; t.runoutAt = 0; t.equity = null;
    const cont = alive(t);
    const ev = {};
    cont.forEach(i => { ev[i] = handEval(t, t.priv.hole[i], t.board); });
    const levels = [...new Set(cont.map(i => S(t, i).total))].sort((a, b) => a - b);
    const pots = []; let prev = 0;
    levels.forEach((L, k) => {
      let amt = 0;
      t.seats.forEach(s => { if (s) amt += Math.min(s.total, L) - Math.min(s.total, prev); });
      if (k === levels.length - 1) t.seats.forEach(s => { if (s && s.total > L) amt += s.total - L; });
      pots.push({ amount: amt, eligible: cont.filter(i => S(t, i).total >= L) });
      prev = L;
    });
    const res = [];
    const boards = t.board2 && t.board2.length === 5 ? [t.board, t.board2] : [t.board];
    const evs = boards.map((b, bi) => bi === 0 ? ev : Object.fromEntries(cont.map(i => [i, handEval(t, t.priv.hole[i], b)])));
    pots.forEach((p, k) => {
      if (!p.amount) return;
      const single = p.eligible.length === 1;
      // 发两次：每个底池对半分（奇数的那 1 个筹码给第一次）
      const parts = single || boards.length === 1 ? [p.amount] : [Math.ceil(p.amount / 2), Math.floor(p.amount / 2)];
      const seatOrder = ws => { const order = []; let x = t.button; for (let n = 0; n < t.seats.length; n++) { x = (x + 1) % t.seats.length; if (ws.includes(x)) order.push(x); } return order; };
      const pay = (order, amount) => { const share = Math.floor(amount / order.length); let rem = amount - share * order.length; order.forEach(i => { S(t, i).stack += share + (rem > 0 ? 1 : 0); rem--; }); };
      parts.forEach((amount0, bi) => {
        const E = evs[bi], run = parts.length > 1 ? bi + 1 : 0, runTxt = run ? '第' + (run === 1 ? '一' : '二') + '次：' : '';
        // 高低分池：有人凑成 8 以下低牌时，低牌拿一半（奇数筹码归高牌）
        let lows = null;
        if (t.game === 'plo8' && !single) {
          const L = {}; p.eligible.forEach(i => { L[i] = evalLow8(t.priv.hole[i], boards[bi]); });
          const q = p.eligible.filter(i => L[i]);
          if (q.length) { const lb = Math.min(...q.map(i => L[i].score)); lows = { order: seatOrder(q.filter(i => L[i].score === lb)), ev: L }; }
        }
        const hiAmt = lows ? Math.ceil(amount0 / 2) : amount0, loAmt = amount0 - hiAmt;
        const best = Math.max(...p.eligible.map(i => E[i].score));
        const order = seatOrder(p.eligible.filter(i => E[i].score === best));
        pay(order, hiAmt);
        res.push({ eligible: p.eligible, amount: hiAmt, winners: order, hand: single ? '' : E[order[0]].name, best: single ? null : E[order[0]].cards, side: k > 0, refund: single, run, hilo: lows ? 'hi' : undefined });
        log(t, `${runTxt}${order.map(i => label(t, i)).join('、')} ${single ? '收回' : '赢得'}${k ? '边池' : '主池'}${lows ? '高牌半池' : ''} ${hiAmt}${single ? '' : '（' + E[order[0]].name + '）'}`);
        if (lows) {
          pay(lows.order, loAmt);
          const lw = lows.ev[lows.order[0]];
          res.push({ eligible: p.eligible, amount: loAmt, winners: lows.order, hand: lw.name, best: lw.cards, side: k > 0, refund: false, run, hilo: 'lo' });
          log(t, `${runTxt}${lows.order.map(i => label(t, i)).join('、')} 赢得${k ? '边池' : '主池'}低牌半池 ${loAmt}（${lw.name}）`);
        }
      });
    });
    // 亮牌规则：赢家与全下者亮牌，其余输家自动盖牌
    const winSet = new Set(res.filter(p => !p.refund).flatMap(p => p.winners));
    cont.forEach(i => { const s = S(t, i); if (winSet.has(i) || s.allIn || s.shown) s.shown = t.priv.hole[i]; else { s.shown = null; s.mucked = true; } });
    t.sdWin = null;
    const mainW = [...new Set(res.filter(p => !p.side && !p.refund).flatMap(p => p.winners))];
    if (mainW.length === 1) sevenDeuce(t, mainW[0]);
    t.result = { pots: res, sd: t.sdWin || null, hands: Object.fromEntries(cont.filter(i => S(t, i).shown).map(i => [i, ev[i].name])), hands2: boards.length > 1 ? Object.fromEntries(cont.filter(i => S(t, i).shown).map(i => [i, evs[1][i].name])) : null, rit: boards.length > 1 };
    finishHand(t, now, 6000);
  }

  /* 7-2 奖金：只在德州现金桌；独赢主池的人底牌是 7 和 2，其他本手发到牌的玩家各付 N 个大盲（不够就付剩下的） */
  const is72 = h => !!h && h.length === 2 && ((h[0][0] === '7' && h[1][0] === '2') || (h[0][0] === '2' && h[1][0] === '7'));
  function sevenDeuce(t, w) {
    t.sdWin = null;
    if (!t.sd72 || t.kind !== 'cash' || t.game !== 'nlh' || !is72(t.priv.hole[w])) return false;
    const each = t.bb * t.sd72; let got = 0;
    t.seats.forEach((s, i) => { if (!s || i === w || !s.inHand) return; const a = Math.min(each, s.stack); s.stack -= a; got += a; });
    if (!got) return false;
    S(t, w).stack += got;
    t.sdWin = { seat: w, amount: got, each };
    log(t, `🃏 ${label(t, w)} 用 7-2 赢下底池，收到 7-2 奖金共 ${got}（每人 ${each}）`);
    return true;
  }
  function rabbit(t) {
    if (t.street !== 'showdown' || !t.result || !t.result.fold || t.board.length >= 5 || t.rabbit) return false;
    const d = t.priv.deck.slice(); const out = [];
    let need = 5 - t.board.length;
    if (t.board.length === 0) { d.pop(); out.push(d.pop(), d.pop(), d.pop()); need -= 3; }
    while (need-- > 0) { d.pop(); out.push(d.pop()); }
    t.rabbit = out; return true;
  }
  function finishHand(t, now, delay) {
    const h = { hand: t.handNo, at: now, board: t.board.slice(), board2: t.board2 && t.board2.length === 5 ? t.board2.slice() : undefined, blinds: t.sb + '/' + t.bb,
      pots: (t.result ? t.result.pots : []).map(p => ({ amount: p.amount, winners: p.winners.map(i => label(t, i)), hand: p.hand || '' })),
      players: t.seats.map((s, i) => s && s.inHand ? { who: label(t, i), uid: s.bot ? null : s.uid, seat: i, net: s.stack - (s.startStack || 0), cards: s.shown || null, folded: s.folded, hole: t.priv.hole[i] || null, vpip: !!s.vpip, pfr: !!s.pfr } : null).filter(Boolean) };
    const st = t.log.map(l => l.indexOf('—— 第 ' + t.handNo + ' 手') === 0).lastIndexOf(true);
    h.log = st >= 0 ? t.log.slice(st + 1) : [];
    t.priv.hist = (t.priv.hist || []).concat([h]).slice(-12);
    t.history = t.priv.hist.map(x => Object.assign({}, x, { players: x.players.map(p => Object.assign({}, p, { hole: undefined })) }));
    t.street = 'showdown'; t.toAct = -1; t.deadline = 0;
    t.currentBet = 0; t.seats.forEach(s => { if (s) s.bet = 0; });
    // 房主可调摊牌停留时间（秒）；弃牌赢的手不会比摊牌更久
    if (t.showSecs) delay = t.result && !t.result.fold ? t.showSecs * 1000 : Math.min(2500, t.showSecs * 1000);
    t.nextHandAt = now + delay;
  }

  /* 一手结束后的清理：离桌、出局、SNG 名次。返回事件交给房主处理钱包 */
  function postHand(t, now) {
    const ev = [];
    const lh = t.priv.hist && t.priv.hist[t.priv.hist.length - 1];
    if (lh && lh.hand === t.handNo && !lh.counted) {
      lh.counted = true;
      ev.push({ type: 'stats', kind: t.kind, players: lh.players.filter(p => p.uid).map(p => ({ uid: p.uid, vpip: p.vpip, pfr: p.pfr, net: p.net, won: p.net > 0, sd: !!p.cards })) });
    }
    const busted = [];
    t.seats.forEach((s, i) => {
      if (!s) return;
      s.bet = 0; s.total = 0; s.inHand = false; s.folded = false; s.allIn = false;
      if (t.kind === 'sng') {
        if (s.stack <= 0 && t.status === 'playing') busted.push(i);
      } else {
        if (s.leaving || s.stack <= 0) { ev.push({ type: 'leave', uid: s.uid, bot: s.bot, stack: s.stack, seat: i, bought: s.bought || 0 }); t.seats[i] = null; }
      }
    });
    if (t.kind === 'sng' && busted.length) {
      const g = t.sng, canRe = g.rebuyLevels && g.level < g.rebuyLevels;
      const elim = [];
      busted.forEach(i => {
        const s = S(t, i);
        // 记录是谁淘汰的：赢下该玩家参与的最后一个底池的人
        const ps = (t.result && t.result.pots || []).filter(p => (p.eligible || []).includes(i) && !p.refund);
        const kp = ps[ps.length - 1]; if (kp) { const w = S(t, kp.winners[0]); s.bustedBy = w ? { uid: w.uid, bot: w.bot, name: w.name } : null; }
      });
      busted.forEach(i => { const s = S(t, i); if (canRe && !s.bot) { s.rebuyUntil = now + 20000; ev.push({ type: 'rebuyOffer', uid: s.uid, seat: i }); } else elim.push(i); });
      eliminate(t, elim, ev);
    }
    t.street = t.status === 'finished' ? 'idle' : 'idle';
    t.board = []; t.result = t.result; t.priv.hole = {};
    t.seats.forEach(s => { if (s) { s.shown = null; s.last = ''; } });
    return ev;
  }

  /* ICM（Malmuth-Harville）：按筹码估算每人奖金价值 */
  function icm(stacks, payouts) {
    const n = stacks.length, total = stacks.reduce((a, b) => a + b, 0), res = Array(n).fill(0);
    if (!total) return res;
    const memo = new Map();
    function rec(mask, place) { // 返回剩余玩家在 place 起的期望奖金数组
      if (place >= payouts.length || mask === 0) return null;
      const key = mask * 16 + place; if (memo.has(key)) return memo.get(key);
      let rem = 0; for (let i = 0; i < n; i++) if (mask & (1 << i)) rem += stacks[i];
      const out = Array(n).fill(0);
      for (let i = 0; i < n; i++) {
        if (!(mask & (1 << i)) || !stacks[i]) continue;
        const p = stacks[i] / rem; out[i] += p * payouts[place];
        const sub = rec(mask & ~(1 << i), place + 1);
        if (sub) for (let j = 0; j < n; j++) out[j] += p * sub[j];
      }
      memo.set(key, out); return out;
    }
    return rec((1 << n) - 1, 0) || res;
  }
  /* 暂停 / 恢复：冻结所有计时 */
  function pause(t, now) { if (t.paused) return; t.paused = now; }
  function resume(t, now) {
    if (!t.paused) return; const d = now - t.paused; t.paused = 0;

  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, k, unb64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* =====================================================================
   Host：房主主持（权威引擎）。练习模式也用它（本地、带机器人、不计金币）
   ===================================================================== */
class Host {
  constructor(mode) {
    this.mode = mode; // 'online' | 'practice'
    this.tables = {}; this.wallets = {}; this.stats = {}; this.profiles = {}; this.hl = null; this.seen = {}; this.mtts = {}; this.mdirty = new Set(); this.lastSeq = {}; this.pks = {}; this.handKeys = {};
    this.dirty = new Set(); this.writing = {}; this.again = {}; this.metaDirty = false;
    this.timer = null; this.listeners = [];
  }
  start() {
    // 用 Worker 计时：页面切到后台时浏览器会限流主线程定时器，Worker 不受影响
    try {
      const src = 'let h=setInterval(()=>postMessage(0),250);onmessage=()=>clearInterval(h);';
      this.worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      this.worker.onmessage = () => this.loop();
    } catch (e) { this.timer = setInterval(() => this.loop(), 250); }
  }
  stop() { if (this.worker) { this.worker.postMessage(0); this.worker.terminate(); this.worker = null; } clearInterval(this.timer); this.timer = null; }
  changed(tid) { if (tid) this.dirty.add(tid); scheduleRender(); }
  bal(uid) { return (this.wallets[uid] && this.wallets[uid].balance) || 0; }

  /* ---- 钱包（唯一写入者） ---- */
  credit(uid, delta, type, note, extra) {
    const w = Object.assign({ uid, balance: 0, totalIn: 0, totalOut: 0, reqSeq: 0 }, this.wallets[uid] || {});
    w.balance = Math.round(w.balance + delta);
    if (type === 'buyin') w.totalIn += delta;
    if (type === 'cashout') w.totalOut += -delta;
    w.updatedAt = now();
    Object.assign(w, extra || {});
    this.wallets[uid] = w;
    // 今晚输赢：只算牌桌/比赛相关的进出
    if (type && ['table-in', 'table-out', 'sng-in', 'sng-refund', 'sng-prize', 'bounty'].includes(type)) {
      const h = this.hlNow(); h.net = h.net || {}; h.net[uid] = Math.round((h.net[uid] || 0) + delta); this.hlSave();
    }
    if (this.mode === 'online') {
      this.writeDoc('wallets/' + uid, w);
      if (type) App.db.collection('ledger').add({ uid, type, amount: Math.round(delta), note: note || '', at: now(), bal: w.balance }).catch(e => toast('账本写入失败：' + (e.code || e.message)));
    }
    scheduleRender();
  }
  writeDoc(path, data) {
    if (this.mode !== 'online') return;
    if (this.writing[path]) { this.again[path] = data; return; }
    this.writing[path] = true;
    App.db.doc(path).set(JSON.parse(JSON.stringify(data))).catch(e => console.warn('write', path, e)).finally(() => {
      this.writing[path] = false;
      if (this.again[path]) { const d = this.again[path]; delete this.again[path]; this.writeDoc(path, d); }
    });
  }
  flush() {
    for (const tid of this.dirty) {
      const t = this.tables[tid];
      if (!t) {
        if (this.mode === 'online') { App.db.doc('live/' + tid).delete().catch(() => { }); App.db.doc(`data/users/${App.me}/eng-${tid}`).delete().catch(() => { }); }
        continue;
      }
      if (this.mode === 'online') {
        const pv = E.publicView(t); pv.at = now();
        this.writeDoc('live/' + tid, pv);
        this.writeDoc(`data/users/${App.me}/eng-${tid}`, { t });
      }
    }
    this.dirty.clear();
    for (const mid of this.mdirty) { const m = this.mtts[mid]; if (this.mode === 'online') { if (m) this.writeDoc('events/' + mid, m); else App.db.doc('events/' + mid).delete().catch(() => { }); } }
    this.mdirty.clear();
    if (this.metaDirty && this.mode === 'online') { this.metaDirty = false; this.writeDoc(`data/users/${App.me}/meta`, { lastSeq: this.lastSeq }); }
  }

  /* ---- 牌桌管理 ---- */
  createTable(cfg) {
    const id = cfg.id || ((cfg.kind === 'sng' ? 'sng-' : 'cash-') + Math.random().toString(36).slice(2, 7));
    const t = E.createTable(Object.assign({}, cfg, { id, now: now() }));
    if (this.mode === 'practice') t.botLevel = Prefs.bot || 'normal';
    this.tables[id] = t; this.changed(id); return t;
  }
  /* ================= 多桌锦标赛 MTT ================= */
  createMtt(cfg) {
    const id = 'mtt-' + Math.random().toString(36).slice(2, 7);
    const m = { id, name: cfg.name || '多桌锦标赛', game: cfg.game || 'nlh', buyIn: cfg.buyIn, startStack: cfg.startStack || 3000, levelMins: cfg.levelMins || 6,
      seatsPer: Math.min(cfg.game === 'plo5' ? 8 : 10, cfg.maxSeats || 6), actionSecs: cfg.actionSecs || 25, startAt: cfg.startAt || 0, repeat: cfg.startAt && ['day', 'week'].includes(cfg.repeat) ? cfg.repeat : '', lateLevels: Math.max(0, Math.min(8, +cfg.lateLevels || 0)), status: 'waiting', entrants: [], tables: [], finish: [],
      level: 0, levelEndsAt: 0, pool: 0, payouts: null, createdAt: now() };
    this.mtts[id] = m; this.mdirty.add(id); scheduleRender(); return m;
  }
  mttIntent(uid, it, err) {
    const m = this.mtts[it.mtt]; if (!m) return err('赛事不存在');
    if (it.t === 'mreg' && m.status === 'playing') {
      if (!mttLateOpen(m, this.tables)) return err('延迟报名已截止');
      if (m.entrants.includes(uid)) return err('你已参赛');
      if (this.bal(uid) < m.buyIn) return err('金币不足，请先向房主申请金币');
      this.credit(uid, -m.buyIn, 'sng-in', `${m.name} 延迟报名`);
      m.entrants.push(uid); m.total = (m.total || 0) + 1; m.pool += m.buyIn;
      // 新人加入：已出局的人名次各往后挪一位；奖金按新人数重算
      m.finish.forEach(f => { f.place++; });
      const pc = E.mttPcts(m.total), amts = pc.map(p => Math.floor(m.pool * p / 100)); amts[0] += m.pool - amts.reduce((x, y) => x + y, 0); m.payouts = amts;
      const live = m.tables.map(id => this.tables[id]).filter(Boolean);
      const cnt = x => x.seats.filter(q => q && q.stack > 0).length;
      let t = live.filter(x => x.seats.some(q => !q)).sort((a, b) => cnt(a) - cnt(b))[0];
      if (!t) {
        const k = m.tables.length + 1;
        t = E.createTable({ id: m.id + '-t' + k + Math.random().toString(36).slice(2, 4), kind: 'sng', game: m.game, name: `${m.name} · 第${k}桌`, buyIn: m.buyIn, startStack: m.startStack, levelMins: m.levelMins, maxSeats: m.seatsPer, actionSecs: m.actionSecs, now: now() });
        t.mtt = m.id; t.mttName = m.name; t.status = 'playing'; t.sng.pool = 0; t.sng.entrants = []; t.sng.level = m.level; t.sng.levelEndsAt = m.levelEndsAt;
        if (this.mode === 'practice') t.botLevel = Prefs.bot || 'normal';
        this.tables[t.id] = t; m.tables.push(t.id);
      }
      const seat = t.seats.findIndex(q => !q); t.seats[seat] = this.mkSeat(uid, m.startStack); t.sng.entrants.push(uid);
      log2(t, `${String(uid).startsWith('bot-') ? uid.slice(4) : '@{' + uid + '}'} 延迟报名入座`);
      this.kick(t); this.changed(t.id); this.mdirty.add(m.id); scheduleRender(); return true;
    }
    if (it.t === 'mreg') {
      if (m.status !== 'waiting') return err('报名已截止');
      if (m.entrants.includes(uid)) return err('你已报名');
      if (this.bal(uid) < m.buyIn) return err('金币不足，请先向房主申请金币');
      this.credit(uid, -m.buyIn, 'sng-in', `${m.name} 报名`);
      m.entrants.push(uid); this.mdirty.add(m.id); scheduleRender(); return true;
    }
    if (it.t === 'munreg') {
      if (m.status !== 'waiting' || !m.entrants.includes(uid)) return false;
      m.entrants = m.entrants.filter(u => u !== uid); this.credit(uid, m.buyIn, 'sng-refund', `${m.name} 退赛`); this.mdirty.add(m.id); scheduleRender(); return true;
    }
    if (it.t === 'mstart') {
      if (uid !== App.me && this.mode === 'online') return err('只有房主能开赛');
      return this.mttStart(m) || err('至少需要 2 人报名');
    }
    if (it.t === 'mcancel') {
      if (m.status !== 'waiting' || (uid !== App.me && this.mode === 'online')) return false;
      m.entrants.forEach(u => { if (!String(u).startsWith('bot-')) this.credit(u, m.buyIn, 'sng-refund', `${m.name} 取消`); });
      delete this.mtts[m.id]; this.mdirty.add(m.id); scheduleRender(); return true;
    }
    return false;
  }
  mttStart(m) {
    const n0 = now(), ents = E.shuffle(m.entrants);
    this.mttRepeat(m);
    if (ents.length < 2) return false;
    const nT = Math.ceil(ents.length / m.seatsPer);
    m.pool = m.buyIn * ents.length;
    const pc = E.mttPcts(ents.length), amts = pc.map(p => Math.floor(m.pool * p / 100)); amts[0] += m.pool - amts.reduce((x, y) => x + y, 0);
    m.payouts = amts; m.status = 'playing'; m.startedAt = n0; m.level = 0; m.levelEndsAt = n0 + m.levelMins * 60000; m.tables = []; m.total = ents.length;
    for (let k = 0; k < nT; k++) {
      const t = E.createTable({ id: m.id + '-t' + (k + 1), kind: 'sng', game: m.game, name: `${m.name} · 第${k + 1}桌`, buyIn: m.buyIn, startStack: m.startStack, levelMins: m.levelMins, maxSeats: m.seatsPer, actionSecs: m.actionSecs, now: n0 });
      t.mtt = m.id; t.mttName = m.name; t.status = 'playing'; t.sng.pool = 0; t.sng.entrants = [];
      if (this.mode === 'practice') t.botLevel = Prefs.bot || 'normal';
      t.button = E.randInt(m.seatsPer) - 1; t.nextHandAt = n0 + 2500;
      this.tables[t.id] = t; m.tables.push(t.id);
    }
    ents.forEach((u, i) => { const t = this.tables[m.tables[i % nT]]; const seat = t.seats.findIndex(s => !s); t.seats[seat] = this.mkSeat(u, m.startStack); t.sng.entrants.push(u); });
    m.tables.forEach(id => { const t = this.tables[id]; log2(t, `多桌锦标赛开始！共 ${ents.length} 人 ${nT} 桌，奖池 ${m.pool}`); this.changed(id); });
    this.mdirty.add(m.id); return true;
  }
  /* 周期赛：到点（不管人够不够）就排好下一场 */
  mttRepeat(m) {
    if (!m.repeat || !m.startAt || m.nextMade) return;
    const per = m.repeat === 'day' ? 86400000 : 7 * 86400000;
    let at = m.startAt + per; while (at < now() + 60000) at += per;
    m.nextMade = true; this.mdirty.add(m.id);
    this.createMtt({ name: m.name, game: m.game, buyIn: m.buyIn, startStack: m.startStack, levelMins: m.levelMins, maxSeats: m.seatsPer, actionSecs: m.actionSecs, startAt: at, repeat: m.repeat, lateLevels: m.lateLevels });
  }
  mkSeat(u, stack) { return String(u).startsWith('bot-') ? E.seatObj(u, stack, { bot: true, name: u.slice(4) }) : E.seatObj(u, stack); }
  mttAlive(m) { let c = 0; m.tables.forEach(id => { const t = this.tables[id]; if (t) t.seats.forEach(s => { if (s && s.stack > 0) c++; }); }); return c; }
  mttBusts(t, busts) {
    const m = this.mtts[t.mtt]; if (!m) return;
    const before = (m.total || m.entrants.length) - m.finish.length;
    busts.forEach((b, k) => {
      const place = before - (busts.length - 1 - k);
      m.finish.push({ uid: b.uid, bot: b.bot, place });
      if (!b.bot) this.notify(b.uid, `你在「${m.name}」获得第 ${place} 名${(m.payouts || [])[place - 1] ? '，奖金 ' + fmt(m.payouts[place - 1]) : ''}`);
      const prize = (m.payouts || [])[place - 1] || 0;
      if (prize > 0 && !b.bot) this.credit(b.uid, prize, 'sng-prize', `${m.name} 第 ${place} 名`);
      this.mttPoints(m, b.uid, place);
    });
    m.finish.sort((x, y) => x.place - y.place); this.mdirty.add(m.id);
    if (before - busts.length <= 1) this.mttEnd(m);
  }
  mttPoints(m, uid, place) {
    const n = m.total || m.entrants.length, pts = Math.round(10 * (n - place + 1) * (place === 1 ? 1.5 : 1)), prize = (m.payouts || [])[place - 1] || 0;
    const st = this.stats[uid] = Object.assign({ uid, hands: 0, vpip: 0, pfr: 0, won: 0, sd: 0, net: 0, best: 0 }, this.stats[uid] || {});
    st.poy = (st.poy || 0) + pts; st.events = (st.events || 0) + 1; if (prize > 0) st.cashes = (st.cashes || 0) + 1; if (place === 1) st.titles = (st.titles || 0) + 1;
    if (this.mode === 'online' && !String(uid).startsWith('bot-')) this.writeDoc('stats/' + uid, st); else App.stats = this.stats;
  }
  mttEnd(m) {
    let w = null, wt = null;
    m.tables.forEach(id => { const t = this.tables[id]; if (t) t.seats.forEach(s => { if (s && s.stack > 0) { w = s; wt = t; } }); });
    if (w) {
      m.finish.unshift({ uid: w.uid, bot: w.bot, place: 1 });
      if (!w.bot) this.credit(w.uid, m.payouts[0], 'sng-prize', `${m.name} 冠军`);
      this.mttPoints(m, w.uid, 1);
      if (!w.bot && this.mode === 'online') App.db.collection('bracelets').add({ uid: w.uid, event: m.name, prize: m.payouts[0], pool: m.pool, entrants: m.total, at: now() }).catch(() => { });
      log2(wt, `🏆 ${w.bot ? w.name : '@{' + w.uid + '}'} 赢得「${m.name}」金手链！`);
    }
    m.status = 'finished'; m.endedAt = now();
    m.tables.forEach(id => { const t = this.tables[id]; if (t) { t.status = 'finished'; t.sng.finish = m.finish.slice(); t.sng.payouts = m.payouts; this.changed(id); } });
    this.mdirty.add(m.id);
  }
  /* 平衡座位与并桌：只从「两手之间」的这张桌移人 */
  /* 泡沫期逐手进行（WSOP 规则）：离钱圈只差一人、还有多张桌时，每张桌打完一手要等其他桌也打完才发下一手，避免有人故意拖时间混进钱圈 */
  hfhHold(t) {
    const m = this.mtts[t.mtt]; if (!m || m.status !== 'playing') return false;
    const live = m.tables.map(id => this.tables[id]).filter(x => x && x.status !== 'finished');
    const left = live.reduce((a, x) => a + x.seats.filter(s => s && s.stack > 0).length, 0), paid = (m.payouts || []).length;
    const on = live.length > 1 && left === paid + 1;
    if (on !== !!m.hfh) { m.hfh = on; this.mdirty.add(m.id); live.forEach(x => log2(x, on ? '⏸ 泡沫期：离钱圈只差 1 人，各桌逐手进行' : '✅ 泡沫破了，恢复正常发牌')); }
    if (!on) return false;
    return live.some(x => x !== t && ['preflop', 'flop', 'turn', 'river'].includes(x.street));
  }
  mttBalance(t) {
    const m = this.mtts[t.mtt]; if (!m || m.status !== 'playing') return;
    const live = m.tables.map(id => this.tables[id]).filter(Boolean);
    const cnt = x => x.seats.filter(s => s && s.stack > 0).length;
    const total = live.reduce((a, x) => a + cnt(x), 0); if (total <= 1) return;
    const need = Math.ceil(total / m.seatsPer);
    const moveSeat = (from, i, to) => {
      // 目标桌没有真正的空位（出局的人还没清走）就不搬，否则玩家会丢失
      if (to.seats.findIndex(x => !x) < 0) return false;
      const s = from.seats[i]; from.seats[i] = null;
      Object.assign(s, { bet: 0, total: 0, inHand: false, folded: false, allIn: false, acted: false, shown: null, last: '', mucked: false });
      const j = to.seats.findIndex(x => !x); to.seats[j] = s;
      log2(to, `${s.bot ? s.name : '@{' + s.uid + '}'} 从 ${from.name.split(' · ')[1] || from.name} 移到本桌`);
      if (!s.bot) this.notify(s.uid, `并桌/平衡：你被移到「${to.name}」`);
      this.changed(to.id);
    };
    if (live.length > need) {
      const min = Math.min(...live.map(cnt));
      if (cnt(t) !== min) return;
      const others = live.filter(x => x !== t);
      t.seats.forEach((s, i) => {
        if (!s) return;
        if (s.stack <= 0) { t.seats[i] = null; return; }
        const dest = others.filter(x => x.seats.some(y => !y)).sort((a, b) => cnt(a) - cnt(b))[0];
        if (dest) moveSeat(t, i, dest);
      });
      if (!t.seats.some(Boolean)) {
        log2(t, '本桌已拆分，玩家已并入其他桌');
        m.tables = m.tables.filter(id => id !== t.id); delete this.tables[t.id]; this.changed(t.id);
        const left = m.tables.map(id => this.tables[id]).filter(Boolean);
        if (left.length === 1) { left[0].name = `${m.name} · 决赛桌`; log2(left[0], '🏁 进入决赛桌！'); this.changed(left[0].id); }
      }
      this.mdirty.add(m.id); return;
    }
    const mx = Math.max(...live.map(cnt)), mn = Math.min(...live.map(cnt));
    if (cnt(t) === mx && mx - mn >= 2) {
      const dest = live.find(x => cnt(x) === mn && x.seats.some(y => !y));
      const i = t.seats.findIndex((s, k) => s && s.stack > 0 && k !== t.button);
      if (dest && i >= 0) { moveSeat(t, i, dest); this.changed(t.id); }
    }
  }
  mttTick(n) {
    for (const id in this.mtts) {
      const m = this.mtts[id];
      if (m.status === 'waiting' && m.startAt && n >= m.startAt) {
        if (m.entrants.length >= 2) this.mttStart(m);
        else if (!m.nextMade && m.repeat) this.mttRepeat(m);
      }
      if (m.status !== 'playing') continue;
      let up = false;
      while (n >= m.levelEndsAt && m.level < E.SNG_LEVELS.length - 1) { m.level++; m.levelEndsAt += m.levelMins * 60000; up = true; }
      if (up) this.mdirty.add(id);
      m.tables.forEach(tid => { const t = this.tables[tid]; if (t) { t.sng.level = m.level; t.sng.levelEndsAt = m.levelEndsAt; t.sng.levelMins = m.levelMins; } });
    }
  }
  togglePause(tid) {
    const t = this.tables[tid]; if (!t) return;
    if (t.paused) { E.resume(t, now()); log2(t, '▶ 房主恢复了牌局'); } else { E.pause(t, now()); log2(t, '⏸ 房主暂停了牌局'); }
    this.changed(tid);
  }
  removeSeat(tid, seat) {
    const t = this.tables[tid]; const s = t && t.seats[seat]; if (!s) return;
    const n = now();
    if (t.kind === 'sng' && t.status === 'playing') { s.out = true; log2(t, `${s.bot ? s.name : '@{' + s.uid + '}'} 被房主设为暂离`); }
    else if (s.inHand && ['preflop', 'flop', 'turn', 'river'].includes(t.street)) { s.leaving = true; if (t.toAct === seat) E.act(t, seat, 'fold', 0, n); }
    else {
      t.seats[seat] = null;
      if (!s.bot) {
        if (t.kind === 'cash' && s.stack > 0) this.credit(s.uid, s.stack, 'table-out', `${t.name} 房主请离座`);
        if (t.kind === 'sng' && t.status === 'waiting') this.credit(s.uid, t.sng.buyIn, 'sng-refund', `${t.name} 房主取消报名`);
      }
    }
    if (!s.bot) this.notify(s.uid, `房主请你离开了「${t.name}」，筹码已回到钱包`);
    this.changed(tid);
  }
  closeTable(tid) {
    const t = this.tables[tid]; if (!t) return;
    if (['preflop', 'flop', 'turn', 'river'].includes(t.street)) return toast('本手进行中，打完再关');
    t.seats.forEach((s, i) => {
      if (!s || s.bot) return;
      if (t.kind === 'cash' && s.stack > 0) this.credit(s.uid, s.stack, 'table-out', `关桌返还 ${t.name}`);
      if (t.kind === 'sng' && t.status === 'waiting') this.credit(s.uid, t.sng.buyIn, 'sng-refund', `锦标赛取消 ${t.name}`);
      if (t.kind === 'sng' && t.status === 'playing') { const tot = t.seats.reduce((x, o) => x + (o ? o.stack + (o.total || 0) : 0), 0) || 1; this.credit(s.uid, Math.floor((t.sng.pool + (t.sng.bountyBank || 0)) * (s.stack + (s.total || 0)) / tot), 'sng-refund', `锦标赛中止按筹码比例退还 ${t.name}`); }
    });
    delete this.tables[tid]; this.changed(tid);
  }

  /* ---- 玩家意图 ---- */
  handleIntent(uid, it) {
    const err = m => { this.notify(uid, m); return false; };
    if (it.t === 'adm') return this.admin(uid, it, err);
    if (it.mtt) return this.mttIntent(uid, it, err);
    const t = this.tables[it.table];
    if (!t && it.t !== 'noop') return err('牌桌不存在');
    const mySeat = t.seats.findIndex(s => s && s.uid === uid);
    const n = now();
    switch (it.t) {
      case 'sit': {
        if (t.kind !== 'cash') return err('这是锦标赛，请报名');
        if (mySeat >= 0) return err('你已在这张桌');

  highlight(t) {

function tonightData() {

function serChart(hl) {

  if (ids.includes(me)) ids = [me].concat(ids.filter(u => u !== me));
  ids = ids.slice(0, 6); if (!ids.length) return '';
  const W = 600, H = 150, P = 6, all = ids.flatMap(u => ser[u]), lo = Math.min(0, ...all), hi = Math.max(0, ...all), span = hi - lo || 1;
  const Y = v => (P + (hi - v) / span * (H - 2 * P)).toFixed(1);
  const cols = ['#e8c15a', '#4ade80', '#60a5fa', '#f472b6', '#f97316', '#a78bfa'];
  const lines = ids.map((u, k) => { const a = ser[u], n = a.length - 1 || 1; return `<polyline fill="none" stroke="${cols[k]}" stroke-width="${u === me ? 3 : 1.8}" stroke-linejoin="round" points="${a.map((v, i) => (P + i / n * (W - 2 * P)).toFixed(1) + ',' + Y(v)).join(' ')}"/>`; }).join('');
  return `<div class="serc"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:120px;display:block"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ffffff33" stroke-dasharray="4 4"/>${lines}</svg>

function reconcileHTML() {
  const H = admH(); const W = H.wallets;
  const tin = Object.values(W).reduce((a, w) => a + (w.totalIn || 0), 0), tout = Object.values(W).reduce((a, w) => a + (w.totalOut || 0), 0);
  const bal = Object.values(W).reduce((a, w) => a + (w.balance || 0), 0);
  let chips = 0;
  Object.values(H.tables).forEach(t => {
    if (t.kind === 'cash') t.seats.forEach(s => { if (s && !s.bot) chips += s.stack + (['preflop', 'flop', 'turn', 'river'].includes(t.street) ? 0 : 0); });
    else if (t.status === 'waiting') chips += t.sng.buyIn * seatedCount(t);
    else if (t.status === 'playing') chips += t.sng.pool + (t.sng.bountyBank || 0);
  });
  Object.values(H.mtts).forEach(m => { if (m.status === 'waiting') chips += m.buyIn * m.entrants.filter(u => !String(u).startsWith('bot-')).length; else if (m.status === 'playing') chips += m.pool; });
  // 手中进行时，已下注筹码在 total 里
  Object.values(H.tables).forEach(t => { if (t.kind === 'cash') t.seats.forEach(s => { if (s && !s.bot && ['preflop', 'flop', 'turn', 'river'].includes(t.street)) chips += s.total; }); });
  const diff = tin - tout - bal - chips;
  return `<div class="note">已发放 ${fmt(tin)} − 已归还 ${fmt(tout)} = 应在场 <b>${fmt(tin - tout)}</b>；钱包 ${fmt(bal)} + 桌上/奖池 ${fmt(chips)} = <b>${fmt(bal + chips)}</b>
    ${diff === 0 ? '<span class="pill ok">平账 ✓</span>' : `<span class="pill live">差额 ${fmt(diff)}</span>`}</div>`;
}

/* ---------- 牌桌视图 ---------- */
function seatPos(k, n) {
  const a = (90 + k * 360 / n) * Math.PI / 180;
  const mob = window.innerWidth < 640;
  const narrow = window.innerWidth < 400;
  if (window.innerHeight < 500 && window.innerWidth > window.innerHeight && !mob) return { x: 50 + 44 * Math.cos(a), y: 50 + (Math.sin(a) > 0 ? 46 : 40) * Math.sin(a), a }; // 手机横屏：下半圈往下放，给公共牌留出空间
  let x = 50 + (mob ? (narrow ? 42.5 : 40) : 44) * Math.cos(a);
  if (mob) { const fw = Math.max(300, window.innerWidth - 20), m = (window.innerWidth < 400 ? 45 : 51) / fw * 100; x = Math.max(m, Math.min(100 - m, x)); } // 座位框不能超出屏幕
  return { x, y: 50 + (mob ? 42 : 40) * Math.sin(a), a };
}
/* 下注筹码如果压到公共牌，就挪到公共牌上方或下方（窄屏手机上容易撞） */
function fixBets() {
  const fw = $('#felt'); if (!fw) return;
  const cards = [...fw.querySelectorAll('.center .board .pc, .center .potwrap')].map(e => e.getBoundingClientRect()).filter(r => r.width);
  // 翻牌前没有公共牌：仍要避开庄家按钮和座位框，只是没有禁区
  const zone = !cards.length ? { left: -1e4, right: -1e4 + 1, top: -1e4, bottom: -1e4 + 1 } : { left: Math.min(...cards.map(r => r.left)) - 4, right: Math.max(...cards.map(r => r.right)) + 4, top: Math.min(...cards.map(r => r.top)) - 4, bottom: Math.max(...cards.map(r => r.bottom)) + 4 };
  const F = fw.getBoundingClientRect();
  fw.querySelectorAll('.bet').forEach(b => {
    // 用布局尺寸（不受入场动画缩放影响）
    const cx = F.left + parseFloat(b.style.left) / 100 * F.width, cy0 = F.top + parseFloat(b.style.top) / 100 * F.height, w = b.offsetWidth, h = b.offsetHeight;
    const r = { left: cx - w / 2, right: cx + w / 2, top: cy0 - h / 2, bottom: cy0 + h / 2, height: h };
    if (r.right <= zone.left || r.left >= zone.right || r.bottom <= zone.top || r.top >= zone.bottom) return;
    const cy = r.top + r.height / 2, mid = (zone.top + zone.bottom) / 2;
    const y = cy < mid ? zone.top - r.height / 2 - 2 : zone.bottom + r.height / 2 + 2;
    b.style.top = ((y - F.top) / F.height * 100).toFixed(2) + '%';
  });
  // 再避开庄家按钮和座位框：沿着朝向牌桌中心的方向一点点挪，但不能挪进公共牌区域
  // 庄家按钮会有移动动画，按它的目标位置（style 百分比）算，再留 3px 余量
  const pad = (r, m) => ({ left: r.left - m, right: r.right + m, top: r.top - m, bottom: r.bottom + m });
  const obst = [...fw.querySelectorAll('.seat .box')].map(e => pad(e.getBoundingClientRect(), 2)).concat([...fw.querySelectorAll('.dealer')].map(d => {
    const cx = F.left + parseFloat(d.style.left) / 100 * F.width, cy = F.top + parseFloat(d.style.top) / 100 * F.height, w = d.offsetWidth || 24, h = d.offsetHeight || 24;
    return pad({ left: cx - w / 2, right: cx + w / 2, top: cy - h / 2, bottom: cy + h / 2 }, 3);
  }));
  const hit = (a, z) => !(a.right <= z.left || a.left >= z.right || a.bottom <= z.top || a.top >= z.bottom);
  fw.querySelectorAll('.bet').forEach(b => {
    let lx = parseFloat(b.style.left), ly = parseFloat(b.style.top);
    const w = b.offsetWidth, h = b.offsetHeight;
    const box = (X, Y) => { const cx = F.left + X / 100 * F.width, cy = F.top + Y / 100 * F.height; return { left: cx - w / 2, right: cx + w / 2, top: cy - h / 2, bottom: cy + h / 2 }; };
    const ok = (X, Y) => X > 3 && X < 97 && Y > 3 && Y < 97 && !hit(box(X, Y), zone);
    const bad = (X, Y) => obst.some(o => hit(box(X, Y), o));
    if (bad(lx, ly)) {
      // 由近到远试 8 个方向（优先朝牌桌中心），挑第一个既不压庄家/座位、也不进公共牌区的位置
      const tx = Math.sign(50 - lx) || 1, ty = Math.sign(50 - ly) || 1;

      const names = ['老K', '阿杰', 'Lucky', '小鱼', '铁头', '莎莎', 'Ace哥', '大卫', '阿强', '美美', '小白', '老王', '阿光', '肥仔', '珍妮', '老陈', '小马', 'Tony'];
      m.demo = true; m.entrants = names.map(n => 'bot-' + n); P.mttStart(m); WTP.openMtt(m.id);
    }
    toast('AI 开打了，你在旁观。随时回大厅');
  },
  resetChips() {
    const P = App.practice; if (!P) return;
    P.wallets.me = Object.assign(P.wallets.me || { uid: 'me' }, { balance: 10000 }); savePractice(); toast('练习币已恢复到 10,000'); render();
  },
  exitPractice() { App.ctx = 'online'; WTP.go('lobby'); },
};

/* ---------------- 启动 ---------------- */
function loadPractice() { try { const v = JSON.parse(localStorage.getItem('wtp_practice') || 'null'); return v && v.bal > 0 ? v.bal : 10000; } catch (e) { return 10000; } }
function savePractice() { try { if (App.practice && App.practice.wallets.me) localStorage.setItem('wtp_practice', JSON.stringify({ bal: App.practice.wallets.me.balance })); } catch (e) { } }
setInterval(savePractice, 5000);
async function boot() {
  setTimeout(applyLang, 0);
  document.body.classList.toggle('four', Prefs.deck === '4'); document.body.dataset.felt = Prefs.felt || 'green'; document.body.classList.toggle('photo', photoDeck());
  if (PUB) { if (Prefs.coach === undefined) Prefs.coach = true; document.body.classList.add('pub'); WTP.enterPractice(); return; }
  render();
  await loadMyKey().catch(() => { });
  const C = window.claude;
  if (!C || !C.use) { App.loadErr = '连接俱乐部中…可以先进练习场体验。'; App.view = 'lobby'; render(); return; }
  const [db, user, room] = await Promise.all([C.use('db'), C.use('user'), C.use('room')]);
  App.db = db; App.user = user; App.room = room;
  if (!db || !user) { App.loadErr = '联机服务不可用（需要登录 claude.ai 并被房主邀请）。可以先进练习场体验。'; render(); return; }
  App.me = await user.id();
  App.isOwner = !!(await user.isOwner());
  if (!App.me) { App.loadErr = '无法识别你的身份，请登录后再打开。'; render(); return; }
  App.online = true;

  subscribeAll();
  if (room) {
    room.presence({ pk: App.pubJwk, prof: Prefs.prof || null }).catch(() => { });
    room.onPeers(ch => { App.gotPeers = true; App.peers = ch.peers.slice(); takeChats(ch.peers); if (App.host) App.host.onPeers(ch.peers); resolveNames(); scheduleRender(); }, () => markNet(true));
    room.on('notice', msg => { if (msg.data && msg.data.to === App.me && !msg.sameTab) toast(String(msg.data.msg).slice(0, 120)); }, () => { });
  }
  window.addEventListener('offline', () => markNet(true));
  window.addEventListener('online', () => reconnect('网络恢复'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && App.online && (App.netDown || (App.gotBeat && !hostAlive() && !App.host))) reconnect('回到页面'); });
  setInterval(() => { if (App.online && !App.host && App.gotBeat && !hostAlive() && navigator.onLine !== false && now() - (App.lastResub || 0) > 30000) reconnect(); }, 10000);
  if (App.isOwner && window.VX_SERVER_HOST) App.remote = new RemoteHost();
  else if (App.isOwner) tryHost();
  render();
}

/* ---------------- 手牌分享 ---------------- */
const SUIT_TXT = { s: '♠', h: '♥', d: '♦', c: '♣' };
function cardTxt(c) { return c === 'XX' ? '🂠' : c ? (c[0] === 'T' ? '10' : c[0]) + SUIT_TXT[c[1]] : ''; }
function plainNames(str) { return String(str).replace(/@\{([^}]+)\}/g, (_, u) => nameOf(u)); }
function shareCards(t, h) {
  const me = myUid(), mine = App.myHoles[t.id + ':' + h.hand];
  return h.players.map(p => { const isMe = p.who === '@{' + me + '}'; return { who: plainNames(p.who), me: isMe, cards: p.cards || (isMe ? mine : null), net: p.net, folded: p.folded }; });
}
function shareText(t, h) {
  const L = [`♠ 万泰扑克 · ${t.name} · 第 ${h.hand} 手（盲注 ${h.blinds}）`];
  shareCards(t, h).forEach(p => { if (p.cards || p.me) L.push(`${p.me ? '我' : p.who}：${p.cards ? p.cards.map(cardTxt).join(' ') : '—'}${p.net ? '（' + (p.net > 0 ? '+' : '') + fmt(p.net) + '）' : ''}`); });
  L.push('公共牌：' + (h.board.length ? h.board.map(cardTxt).join(' ') : '未发'));
  if (h.board2) L.push('第二次：' + h.board2.map(cardTxt).join(' '));
  h.pots.forEach(p => L.push(`${plainNames(p.winners.join('、'))} 赢得 ${fmt(p.amount)}${p.hand ? '（' + p.hand + '）' : ''}`));
  L.push('—— VANTAX POKER 万泰扑克');
  return L.join('\n');
}
function shareImage(t, h) {
  return new Promise((res, rej) => {
    const ps = shareCards(t, h).filter(p => p.cards || p.me);
    const W = 760, rowH = 66, H = 250 + (h.board2 ? 92 : 0) + ps.length * rowH + h.pots.length * 26 + 60;
    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2; const x = c.getContext('2d'); x.scale(2, 2);
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0e1a2c'); g.addColorStop(1, '#070d16'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#d8b47c'; x.lineWidth = 2; x.strokeRect(10, 10, W - 20, H - 20);
    const F = (w, sz) => `${w} ${sz}px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif`;
    const card = (cx, cy, cd, w) => {
      const hh = w * 1.4; x.fillStyle = '#fdfcf7'; x.beginPath(); x.roundRect(cx, cy, w, hh, 6); x.fill();
      x.strokeStyle = '#bbb'; x.lineWidth = 1; x.stroke();
      const red = cd[1] === 'h' || cd[1] === 'd'; x.fillStyle = red ? '#c8102e' : '#111';
      x.font = F(800, w * .42); x.textAlign = 'center'; x.fillText(cd[0] === 'T' ? '10' : cd[0], cx + w / 2, cy + hh * .45);
      x.font = F(400, w * .46); x.fillText(SUIT_TXT[cd[1]], cx + w / 2, cy + hh * .86);
    };
    const back = (cx, cy, w) => { x.fillStyle = '#12243b'; x.beginPath(); x.roundRect(cx, cy, w, w * 1.4, 6); x.fill(); x.strokeStyle = '#d8b47c'; x.stroke(); };
    const img = new Image();
    img.onload = img.onerror = () => {
      try {
        if (img.naturalWidth) x.drawImage(img, 28, 26, 54, 54);
        x.textAlign = 'left'; x.fillStyle = '#f3d9a4'; x.font = F(900, 24); x.fillText('VANTAX POKER', 94, 52);
        x.fillStyle = '#9aa4b2'; x.font = F(500, 14); x.fillText(`万泰扑克 · ${t.name} · 第 ${h.hand} 手 · 盲注 ${h.blinds}`, 94, 74);
        let y = 108; x.fillStyle = '#9aa4b2'; x.font = F(600, 13); x.fillText(h.board2 ? '第一次' : '公共牌', 28, y + 4);
        const cw = 62; for (let k = 0; k < 5; k++) { const cd = h.board[k]; cd ? card(100 + k * (cw + 10), y - 16, cd, cw) : back(100 + k * (cw + 10), y - 16, cw); }
        y += 102;
        if (h.board2) { x.fillStyle = '#9aa4b2'; x.fillText('第二次', 28, y + 4); for (let k = 0; k < 5; k++) card(100 + k * (cw + 10), y - 16, h.board2[k], cw); y += 92; }
        x.strokeStyle = '#2b3a52'; x.beginPath(); x.moveTo(28, y - 6); x.lineTo(W - 28, y - 6); x.stroke();
        ps.forEach(p => {
          x.textAlign = 'left'; x.fillStyle = p.me ? '#f3d9a4' : '#e6e6e6'; x.font = F(700, 16); x.fillText(p.me ? (nameOf(myUid()) === '我' ? '我' : nameOf(myUid()) + '（我）') : p.who, 28, y + 30);
          (p.cards || []).forEach((cd, k) => card(260 + k * 44, y + 6, cd, 40));
          if (!p.cards) { back(260, y + 6, 40); back(304, y + 6, 40); }
          x.textAlign = 'right'; x.font = F(800, 18); x.fillStyle = p.net > 0 ? '#4ade80' : p.net < 0 ? '#f87171' : '#9aa4b2'; x.fillText(p.net ? (p.net > 0 ? '+' : '') + fmt(p.net) : '0', W - 28, y + 32);
          y += rowH;
        });
        x.textAlign = 'left'; x.font = F(600, 15); x.fillStyle = '#f3d9a4';
        h.pots.forEach(p => { x.fillText(`🏆 ${plainNames(p.winners.join('、'))} 赢得 ${fmt(p.amount)}${p.hand ? '（' + p.hand + '）' : ''}`, 28, y + 14); y += 26; });
        x.fillStyle = '#5b6573'; x.font = F(500, 12); x.fillText('© 万泰游戏开发 · VANTAX POKER', 28, H - 26);
        res(c.toDataURL('image/png'));
      } catch (e) { rej(e); }
    };
    const lg = document.querySelector('.logo img'); img.src = lg ? lg.src : '';
  });
}

/* ---------------- 订阅与断线重连 ---------------- */
let unsubs = [], resubT = null, resubN = 0;
function snapErr(what) { return e => { console.warn('snapshot', what, e && e.code); markNet(true); scheduleResub(); }; }
function markNet(down) {
  if (!!App.netDown === !!down) return;
  App.netDown = !!down; App.netSince = now();
  if (!down) { resubN = 0; if (App.wasDown) toast('已重新连接'); App.wasDown = false; } else App.wasDown = true;
  scheduleRender();
}
function scheduleResub() {
  if (resubT) return;
  const d = Math.min(30000, 2000 * Math.pow(2, resubN++));
  resubT = setTimeout(() => { resubT = null; subscribeAll(); }, d);
}
function reconnect(why) {
  if (!App.db) return;
  App.lastResub = now();
  if (why) toast(why + '，正在重新同步…');
  subscribeAll();
  if (App.room) App.room.presence({ pk: App.pubJwk, prof: Prefs.prof || null }).catch(() => markNet(true));
}
function subscribeAll() {
  const db = App.db; if (!db) return;
  unsubs.forEach(u => { try { typeof u === 'function' && u(); } catch (e) { } }); unsubs = [];
  App.lastResub = now();
  const ok = () => { if (App.netDown) markNet(false); };
  const coll = (name, fn) => unsubs.push(db.collection(name).onSnapshot(snap => { ok(); const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); fn(o); scheduleRender(); }, snapErr(name)));
  const loadTimer = setTimeout(() => { if (!App.gotTables) { App.loadErr = '数据连接较慢，稍后会自动刷新…'; render(); } }, 10000);
  unsubs.push(db.collection('live').onSnapshot(snap => {
    App.gotTables = true; clearTimeout(loadTimer); ok(); if (/较慢/.test(App.loadErr || '')) App.loadErr = '';
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
    App.tables = o;
    syncHoles(o); resolveNames(); scheduleRender();
  }, snapErr('live')));
  unsubs.push(db.doc('hostlock/main').onSnapshot(d => {
    App.gotBeat = true; const v = d.exists ? d.data() : null;
    if (v && v.beat && !d.metadata.fromCache) { App.beat = v.beat; skewSample(v.beat - now()); ok(); }
    scheduleRender();
  }, snapErr('beat')));
  coll('wallets', o => { App.wallets = o; resolveNames(); });
  coll('events', o => { App.events = o; });
  coll('stats', o => { App.stats = o; });
  coll('profiles', o => { App.profiles = o; });
  unsubs.push(db.collection('sessions').orderBy('since', 'desc').limit(30).onSnapshot(snap => { App.sessions = {}; snap.docs.forEach(d => { App.sessions[d.id] = d.data(); }); scheduleRender(); }, snapErr('sessions')));
  unsubs.push(db.doc('club/info').onSnapshot(d => {
    App.club = d.exists ? d.data() : null;
    if (coAdmin() && !App.remote) App.remote = new RemoteHost(); else if (!App.isOwner && !coAdmin() && App.remote) App.remote = null;
    scheduleRender();
  }, snapErr('club')));
  unsubs.push(db.doc('club/highlights').onSnapshot(d => { App.highlights = d.exists ? d.data() : null; scheduleRender(); }, snapErr('hl')));
  unsubs.push(db.collection('ledger').orderBy('at', 'desc').limit(400).onSnapshot(snap => { App.ledger = snap.docs.map(d => d.data()); scheduleRender(); }, snapErr('ledger')));
  unsubs.push(db.collection('bracelets').orderBy('at', 'desc').limit(100).onSnapshot(snap => { App.bracelets = snap.docs.map(d => d.data()); resolveNames(); scheduleRender(); }, snapErr('bracelets')));
}

async function tryHost() {
  const db = App.db;
  const lock = db.doc('hostlock/main');
  const tick = async () => {
    try {
      const r = await lock.acquire({ holder: TAB_ID, ttlMs: 20000, data: { beat: now() } });
      if (r.acquired && !App.host) await becomeHost();
      if (!r.acquired && App.host) { App.host.stop(); App.host = null; toast('主持权已转到另一个标签页'); render(); }
    } catch (e) { console.warn('lock', e); }
  };
  await tick(); setInterval(tick, 7000);
}
async function becomeHost() {
  const H = new Host('online');
  const [ws, mine] = await Promise.all([App.db.collection('wallets').get(), App.db.collection('data/users/' + App.me).get()]);
  ws.docs.forEach(d => { if (d.exists) H.wallets[d.id] = d.data(); });
  try { (await App.db.collection('events').get()).docs.forEach(d => { if (d.exists) H.mtts[d.id] = d.data(); }); } catch (e) { }
  try { (await App.db.collection('stats').get()).docs.forEach(d => { if (d.exists) H.stats[d.id] = d.data(); }); } catch (e) { }
  try { const d = await App.db.doc('club/highlights').get(); if (d.exists) H.hl = d.data(); } catch (e) { }
  try { const d = await App.db.doc('club/info').get(); if (d.exists) H.club = d.data(); } catch (e) { }
  try { (await App.db.collection('profiles').get()).docs.forEach(d => { if (d.exists) { const c = cleanProf(d.data()); if (c) H.profiles[d.id] = c; } }); } catch (e) { }
  mine.docs.forEach(d => {
    if (!d.exists) return; const v = d.data();
    if (d.id === 'meta') H.lastSeq = Object.assign({}, v.lastSeq || {});
    else if (d.id.startsWith('eng-') && v.t) {
      const t = JSON.parse(JSON.stringify(v.t));
      if (t.toAct >= 0) t.deadline = now() + t.actionSecs * 1000;
      H.tables[t.id] = t;
    }
  });
  // 本地申请（房主自己）
  await H.restoreKeys();
  App.host = H; H.start();
  if (App.room) H.onPeers(App.room.peers());
  Object.keys(H.tables).forEach(id => H.changed(id));
  toast('你是房主，本页正在主持牌局（请保持打开）');
  render();
}

function chatMode() { const c = App.ctx === 'online' ? (App.host ? App.host.club : App.club) : null; return (c && c.chat) || 'on'; }
function chatAllowed(text) { const m = chatMode(); return m === 'on' || (m === 'emoji' && REACTS.includes(text)); }
function takeChats(peers) {
  peers.forEach(p => {
    const c = p.presence && p.presence.chat; if (!c || !p.by || typeof c.text !== 'string') return;
    const k = p.peer; if ((App.chatSeq[k] || 0) >= c.seq) return;
    App.chatSeq[k] = c.seq;
    if (Date.now() - c.seq > 120000) return; // 旧消息不重放
    if (!chatAllowed(c.text) || isMuted(p.by)) return;
    App.chats.push({ uid: p.by, tid: String(c.tid || ''), text: c.text.slice(0, 60), at: now() });
    if (App.chats.length > 300) App.chats.shift();
    if (!p.isMe) SFX.tick();
    setTimeout(scheduleRender, 5100);
  });
}
const skewS = [];
function skewSample(x) { skewS.push(x); if (skewS.length > 8) skewS.shift(); App.clockSkew = Math.max(...skewS); }
let nameReq = new Set();
async function resolveNames() {
  if (!App.user || !App.user.profiles) return;
  const ids = new Set();
  Object.keys(App.wallets).forEach(u => ids.add(u));
  App.peers.forEach(p => p.by && ids.add(p.by));
  Object.values(App.tables).forEach(t => t.seats.forEach(s => s && !s.bot && ids.add(s.uid)));
  App.bracelets.forEach(b => ids.add(b.uid));
  App.ledger.forEach(l => ids.add(l.uid));
  if (App.host) Object.values(App.host.tables).forEach(t => t.seats.forEach(s => s && !s.bot && ids.add(s.uid)));
  const need = [...ids].filter(u => u && !App.names[u] && !nameReq.has(u));
  if (!need.length) return;
  need.forEach(u => nameReq.add(u));
  try {
    const ps = await App.user.profiles(need);
    need.forEach(u => { const p = ps && ps[u]; if (p && p.name) App.names[u] = p.name; });
    scheduleRender();
  } catch (e) { }
}

// 键盘快捷键（电脑）：F 弃牌 · C 过牌/跟注 · R 加注 · A 全下
document.addEventListener('keydown', e => {
  if (App.view !== 'table' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
  if ($('#modal') && $('#modal').innerHTML.trim()) return;
  const k = e.key.toLowerCase(), bar = $('.actbar'); if (!bar) return;
  const click = sel => { const b = bar.querySelector(sel); if (b) { e.preventDefault(); b.click(); return true; } };
  if (k === 'f') click('.btn.big.red');
  else if (k === 'c' || k === ' ') click('.btn.big.green');
  else if (k === 'r' || k === 'enter') click('.btn.big.gold');
  else if (k === 'a') { const b = [...bar.querySelectorAll('button')].find(x => x.textContent.trim() === '全下'); if (b) { e.preventDefault(); b.click(); } }
});
// 牌面/筹码图片在公开版里是单独文件、异步加载：到了再换成照片牌面
window.__vxAssets = () => { document.body.classList.toggle('photo', photoDeck()); sigs.felt = sigs.act = null; scheduleRender(); };
window.addEventListener('resize', () => { document.body.classList.toggle('photo', photoDeck()); sigs.felt = null; scheduleRender(); });
boot();
})();
