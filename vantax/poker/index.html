<style>
:root{
  --bg:#0a0a0c; --panel:#141418; --panel2:#1b1b21; --line:#2a2a33; --txt:#ece7dc; --mute:#9a958a;
  --gold:#d4ac55; --gold2:#f3d68a; --red:#c2183a; --green:#1f8a4c; --felt:#0e4a33; --felt2:#0a3324;
  --blue:#3b82f6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--gold2)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(#000,#0d0d10);border-bottom:1px solid #3a3020}
.logo{display:flex;align-items:center;gap:10px;font-family:Cinzel,serif;font-weight:800;letter-spacing:.06em;color:var(--gold2);font-size:18px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e2a4,#b8862f 60%,#6b4b14);display:grid;place-items:center;color:#1a1206;font-size:18px;box-shadow:0 0 0 2px #000,0 0 0 3px #b8862f}
.logo small{display:block;font-family:"Noto Sans SC";font-weight:500;font-size:11px;color:var(--mute);letter-spacing:.2em}
nav{display:flex;gap:4px;flex:1;overflow:auto}
nav button{background:none;border:0;color:var(--mute);padding:8px 12px;border-radius:8px;white-space:nowrap}
nav button.on{color:#000;background:var(--gold)}
nav button:hover:not(.on){color:var(--txt);background:#ffffff10}
.wallet{display:flex;align-items:center;gap:8px;background:#000;border:1px solid #3a3020;border-radius:999px;padding:4px 4px 4px 12px;white-space:nowrap}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffeaa8,#d39b2a 65%,#7a5310);vertical-align:-2px;box-shadow:inset 0 0 0 2px #e9be5c}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px 14px;border-radius:8px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.gold{background:linear-gradient(#f0cf7a,#c4963f);color:#1a1206;border-color:#e3bd63;font-weight:700}
.btn.red{background:linear-gradient(#d4284a,#9b0f2a);border-color:#e0405e;color:#fff;font-weight:700}
.btn.green{background:linear-gradient(#27a35c,#17703e);border-color:#36b46b;color:#fff;font-weight:700}
.btn.sm{padding:5px 10px;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#ffffff12;color:var(--mute)}
.pill.live{background:#c2183a33;color:#ff6b86}
.pill.ok{background:#1f8a4c33;color:#5fe39a}
.pill.gold{background:#d4ac5530;color:var(--gold2)}
main{max-width:1280px;margin:0 auto;padding:18px}
.hero{position:relative;border-radius:16px;overflow:hidden;padding:34px 30px;margin-bottom:20px;background:
  radial-gradient(ellipse at 80% 20%,#c2183a55,transparent 55%),radial-gradient(ellipse at 10% 90%,#d4ac5533,transparent 50%),linear-gradient(135deg,#17110a,#0b0b0d 60%);border:1px solid #3a3020}
.hero h1{font-family:Cinzel,"Noto Sans SC",serif;margin:0 0 6px;font-size:30px;color:var(--gold2);letter-spacing:.04em}
.hero p{margin:0;color:var(--mute);max-width:640px;line-height:1.7}
.hero .suits{display:none;position:absolute;right:24px;top:10px;font-size:110px;opacity:.07;letter-spacing:-10px;pointer-events:none}
.hero .rules{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
h2.sec{font-family:Cinzel,"Noto Sans SC",serif;color:var(--gold2);font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#3a3020,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card-t{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.card-t:hover{border-color:#5a4a2a}
.card-t .ttl{font-weight:700;font-size:16px}
.card-t .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:13px}
.card-t .meta b{color:var(--txt);font-weight:600}
.card-t .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.card-t .band{position:absolute;right:-30px;top:12px;transform:rotate(35deg);background:var(--red);color:#fff;font-size:11px;padding:2px 34px;font-weight:700}
.empty{color:var(--mute);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th,table.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.list th{color:var(--mute);font-weight:500;font-size:12px}
table.list td.num,table.list th.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:#5fe39a}.neg{color:#ff6b86}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input,select{background:#0c0c0f;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
/* ---------- table view ---------- */
.tv{display:grid;grid-template-columns:1fr 280px;gap:14px}
@media(max-width:980px){.tv{grid-template-columns:1fr}}
.tv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tv-head .nm{font-weight:900;font-size:18px}
.felt-wrap{position:relative;width:100%;aspect-ratio:16/10;max-height:72vh}
@media(max-width:640px){.felt-wrap{aspect-ratio:3/4}}
.felt{position:absolute;inset:7% 9%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#16704d,var(--felt) 45%,var(--felt2) 100%);
  box-shadow:0 0 0 10px #2a1a0c,0 0 0 13px #b8862f,0 0 0 15px #3b2610,0 20px 60px #000c, inset 0 0 60px #0008}
.felt .brand{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:Cinzel,serif;font-weight:800;color:#ffffff14;font-size:clamp(14px,2.4vw,26px);letter-spacing:.2em;white-space:nowrap}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:70%}
.board{display:flex;gap:6px;min-height:calc(var(--cw)*1.4)}
.pot{background:#000a;border:1px solid #d4ac5566;color:var(--gold2);padding:3px 12px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.result{background:#000c;border:1px solid var(--gold);color:var(--gold2);padding:6px 12px;border-radius:10px;font-size:13px;text-align:center;max-width:100%}
.felt-wrap{--cw:clamp(30px,4.4vw,52px)}
.pc{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.12);background:linear-gradient(#fff,#ececec);color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;line-height:1;box-shadow:0 2px 6px #0008;position:relative;font-family:Georgia,serif;user-select:none}
.pc .r{font-size:calc(var(--cw)*.46)}
.pc .s{font-size:calc(var(--cw)*.44)}

:root{--bg:#0e1013;--panel:#16191e;--panel2:#1c2027;--line:#262b33;--txt:#e9ebee;--mute:#8b929c;--gold:#e0b453;--gold2:#f2cf7a}

.wallet{background:#0b0d10;border-color:#2a2f38}
.btn{border-radius:6px;background:#232831;border-color:#323844;box-shadow:inset 0 1px 0 #ffffff10}
.btn.gold{background:#e0b453;border-color:#e9c272;color:#1b1406;box-shadow:inset 0 1px 0 #fff5,0 1px 0 #0006}
.btn.red{background:#b4232f;border-color:#c93a46;box-shadow:inset 0 1px 0 #fff3}
.btn.green{background:#1f8f4e;border-color:#2aa55e;box-shadow:inset 0 1px 0 #fff3}
.pill{border-radius:4px;background:#232831}

  box-shadow:0 0 0 2px #0a0604,0 0 0 clamp(3px,.4vw,5px) #6e4a2a,0 0 0 calc(clamp(3px,.4vw,5px) + 2px) #2a1a0f,0 24px 60px #000d,inset 0 0 0 2px #8a5f37,inset 0 0 0 4px #3b2414,inset 0 10px 40px #000a,inset 0 -6px 30px #0006;
  outline:1px dashed #5b3f28;outline-offset:calc(clamp(10px,1.6vw,18px) * -.5 - 1px)}

.pc{background:linear-gradient(#fefdfb,#f3f1ec);border:1px solid #cdc8bd;border-radius:calc(var(--cw)*.1);box-shadow:0 1px 1px #0003,0 3px 8px #0006;font-family:Arial,"Helvetica Neue",sans-serif;display:block;color:#121212}

.pc .ci b{font-size:calc(var(--cw)*.36);letter-spacing:-.04em}.pc .ci i{font-style:normal;font-size:calc(var(--cw)*.3)}
.pc .tl{left:calc(var(--cw)*.07);top:calc(var(--cw)*.07)}.pc .br{right:calc(var(--cw)*.07);bottom:calc(var(--cw)*.07);transform:rotate(180deg)}

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

        var col = 0;

        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;

function hlName(u) { return !u ? '?' : String(u).startsWith('bot-') ? u.slice(4) : u === myUid() ? '我' : nameOf(u); }
function tonightData() {
  const hl = App.ctx === 'practice' ? App.highlights : (App.host ? App.host.hl : App.highlights);
  const since = hl && hl.since && now() - hl.since < 12 * 3600000 ? hl.since : now() - 12 * 3600000;
  let net = {};
  if (hl && hl.net && now() - hl.since < 12 * 3600000) net = Object.assign({}, hl.net);
  else if (App.ctx !== 'practice') App.ledger.forEach(l => {
    if (l.at < since) return;
    const sgn = { 'table-in': 1, 'table-out': 1, 'sng-in': 1, 'sng-refund': 1, 'sng-prize': 1, bounty: 1 }[l.type]; if (!sgn) return;
    net[l.uid] = (net[l.uid] || 0) + l.amount;
  });
  // 还坐在现金桌上的人：把桌上筹码算回去，否则带入会被当成输掉
  const live = {};
  Object.values(getTables()).forEach(t => { if (t.kind !== 'cash') return; t.seats.forEach(s => { if (s && !s.bot && (s.uid in net || s.bought)) { net[s.uid] = (net[s.uid] || 0) + s.stack; live[s.uid] = 1; } }); });
  Object.defineProperty(net, '_live', { value: live, enumerable: false });
  const champs = App.ctx === 'practice' ? [] : App.bracelets.filter(b => b.at >= since);
  return { hl: hl && hl.since && now() - hl.since < 12 * 3600000 ? hl : null, net, champs };
}

/* 今晚盈亏曲线（SVG 折线，最多 6 人，我总是在内） */
function serChart(hl) {
  const ser = hl && hl.ser; if (!ser) return '';
  const me = myUid();
  let ids = Object.keys(ser).filter(u => ser[u].length > 2).sort((a, b) => Math.abs(ser[b][ser[b].length - 1]) - Math.abs(ser[a][ser[a].length - 1]));

setInterval(() => {
  const skew = App.host || App.ctx === 'practice' ? 0 : App.clockSkew;
  document.querySelectorAll('[data-dl]').forEach(el => {
    const left = (+el.dataset.dl - (now() + skew)) / 1000;
    if (el.closest('.seat.me') && left > 0 && left <= 5) { const sec = Math.ceil(left); if (App.lastTick !== el.dataset.dl + ':' + sec) { App.lastTick = el.dataset.dl + ':' + sec; SFX.warn(); if (sec === 5) buzz(250); } }
    const pct = Math.max(0, Math.min(100, (+el.dataset.dl - (now() + skew)) / (+el.dataset.secs * 10)));
    el.style.width = pct + '%'; el.style.background = pct < 25 ? '#ef4444' : pct < 50 ? '#f5b82e' : '#3ccf6e';
  });
  document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = Math.max(0, Math.ceil((+el.dataset.cd - (now() + skew)) / 1000)); });
  document.querySelectorAll('[data-until]').forEach(el => {
    const ms = Math.max(0, +el.dataset.until - (now() + skew)); const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
    const hh = Math.floor(ms / 3600000); el.textContent = `${el.dataset.pre || '涨盲 '}${hh ? hh + ':' + String(m % 60).padStart(2, '0') : m}:${String(s).padStart(2, '0')}`;
    if (!el.dataset.pre) el.classList.toggle('soon', ms > 0 && ms <= 30000);
  });
  // 锦标赛涨盲提醒：涨盲前 30 秒提示一次下一级盲注（坐在桌上的人还会响一声、震一下）
  const ct = App.view === 'table' && getTables()[App.curTable];

    const left = ct.sng.levelEndsAt - (now() + skew), key = ct.id + ':' + ct.sng.level;

    }
  }
}, 250);

/* ---------------- 手牌分享 ---------------- */
const SUIT_TXT = { s: '♠', h: '♥', d: '♦', c: '♣' };
function cardTxt(c) { return c === 'XX' ? '🂠' : c ? (c[0] === 'T' ? '10' : c[0]) + SUIT_TXT[c[1]] : ''; }
function plainNames(str) { return String(str).replace(/@\{([^}]+)\}/g, (_, u) => nameOf(u)); }
function shareCards(t, h) {
  const me = myUid(), mine = App.myHoles[t.id + ':' + h.hand];
  return h.players.map(p => { const isMe = p.who === '@{' + me + '}'; return { who: plainNames(p.who), me: isMe, cards: p.cards || (isMe ? mine : null), net: p.net, folded: p.folded }; });
}
function shareText(t, h) {
  const L = [`♠ 万泰扑克 · ${t.name} · 第 ${h.hand} 手（盲注 ${h.blinds}）`];
  shareCards(t, h).forEach(p => { if (p.cards || p.me) L.push(`${p.me ? '我' : p.who}：${p.cards ? p.cards.map(cardTxt).join(' ') : '—'}${p.net ? '（' + (p.net > 0 ? '+' : '') + fmt(p.net) + '）' : ''}`); });
  L.push('公共牌：' + (h.board.length ? h.board.map(cardTxt).join(' ') : '未发'));
  if (h.board2) L.push('第二次：' + h.board2.map(cardTxt).join(' '));
  h.pots.forEach(p => L.push(`${plainNames(p.winners.join('、'))} 赢得 ${fmt(p.amount)}${p.hand ? '（' + p.hand + '）' : ''}`));
  L.push('—— VANTAX POKER 万泰扑克');
  return enTxt(L.join('\n'));
}
function shareImage(t, h) {
  return new Promise((res, rej) => {
    const ps = shareCards(t, h).filter(p => p.cards || p.me);
    const W = 760, rowH = 66, H = 250 + (h.board2 ? 92 : 0) + ps.length * rowH + h.pots.length * 26 + 60;
    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2; const x = c.getContext('2d'); x.scale(2, 2);
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0e1a2c'); g.addColorStop(1, '#070d16'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#d8b47c'; x.lineWidth = 2; x.strokeRect(10, 10, W - 20, H - 20);
    const F = (w, sz) => `${w} ${sz}px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif`;
    const card = (cx, cy, cd, w) => {
      const hh = w * 1.4; x.fillStyle = '#fdfcf7'; x.beginPath(); x.roundRect(cx, cy, w, hh, 6); x.fill();
      x.strokeStyle = '#bbb'; x.lineWidth = 1; x.stroke();
      const red = cd[1] === 'h' || cd[1] === 'd'; x.fillStyle = red ? '#c8102e' : '#111';
      x.font = F(800, w * .42); x.textAlign = 'center'; x.fillText(cd[0] === 'T' ? '10' : cd[0], cx + w / 2, cy + hh * .45);
      x.font = F(400, w * .46); x.fillText(SUIT_TXT[cd[1]], cx + w / 2, cy + hh * .86);
    };
    const back = (cx, cy, w) => { x.fillStyle = '#12243b'; x.beginPath(); x.roundRect(cx, cy, w, w * 1.4, 6); x.fill(); x.strokeStyle = '#d8b47c'; x.stroke(); };
    const img = new Image();
    img.onload = img.onerror = () => {
      try {
        if (img.naturalWidth) x.drawImage(img, 28, 26, 54, 54);
        x.textAlign = 'left'; x.fillStyle = '#f3d9a4'; x.font = F(900, 24); x.fillText('VANTAX POKER', 94, 52);
        x.fillStyle = '#9aa4b2'; x.font = F(500, 14); x.fillText(`万泰扑克 · ${t.name} · 第 ${h.hand} 手 · 盲注 ${h.blinds}`, 94, 74);
        let y = 108; x.fillStyle = '#9aa4b2'; x.font = F(600, 13); x.fillText(h.board2 ? '第一次' : '公共牌', 28, y + 4);
        const cw = 62; for (let k = 0; k < 5; k++) { const cd = h.board[k]; cd ? card(100 + k * (cw + 10), y - 16, cd, cw) : back(100 + k * (cw + 10), y - 16, cw); }
        y += 102;
        if (h.board2) { x.fillStyle = '#9aa4b2'; x.fillText('第二次', 28, y + 4); for (let k = 0; k < 5; k++) card(100 + k * (cw + 10), y - 16, h.board2[k], cw); y += 92; }
        x.strokeStyle = '#2b3a52'; x.beginPath(); x.moveTo(28, y - 6); x.lineTo(W - 28, y - 6); x.stroke();
        ps.forEach(p => {
          x.textAlign = 'left'; x.fillStyle = p.me ? '#f3d9a4' : '#e6e6e6'; x.font = F(700, 16); x.fillText(p.me ? (nameOf(myUid()) === '我' ? '我' : nameOf(myUid()) + '（我）') : p.who, 28, y + 30);
          (p.cards || []).forEach((cd, k) => card(260 + k * 44, y + 6, cd, 40));
          if (!p.cards) { back(260, y + 6, 40); back(304, y + 6, 40); }
          x.textAlign = 'right'; x.font = F(800, 18); x.fillStyle = p.net > 0 ? '#4ade80' : p.net < 0 ? '#f87171' : '#9aa4b2'; x.fillText(p.net ? (p.net > 0 ? '+' : '') + fmt(p.net) : '0', W - 28, y + 32);
          y += rowH;
        });
        x.textAlign = 'left'; x.font = F(600, 15); x.fillStyle = '#f3d9a4';
        h.pots.forEach(p => { x.fillText(`🏆 ${plainNames(p.winners.join('、'))} 赢得 ${fmt(p.amount)}${p.hand ? '（' + p.hand + '）' : ''}`, 28, y + 14); y += 26; });
        x.fillStyle = '#5b6573'; x.font = F(500, 12); x.fillText('© 万泰游戏开发 · VANTAX POKER', 28, H - 26);
        res(c.toDataURL('image/png'));
      } catch (e) { rej(e); }
    };
    const lg = document.querySelector('.logo img'); img.src = lg ? lg.src : '';
  });
}

/* ---------------- 订阅与断线重连 ---------------- */
let unsubs = [], resubT = null, resubN = 0;
function snapErr(what) { return e => { console.warn('snapshot', what, e && e.code); markNet(true); scheduleResub(); }; }
function markNet(down) {
  if (!!App.netDown === !!down) return;
  App.netDown = !!down; App.netSince = now();
  if (!down) { resubN = 0; if (App.wasDown) toast('已重新连接'); App.wasDown = false; } else App.wasDown = true;
  scheduleRender();
}
function scheduleResub() {
  if (resubT) return;
  const d = Math.min(30000, 2000 * Math.pow(2, resubN++));
  resubT = setTimeout(() => { resubT = null; subscribeAll(); }, d);
}
function reconnect(why) {
  if (!App.db) return;
  App.lastResub = now();
  if (why) toast(why + '，正在重新同步…');
  subscribeAll();
  if (App.room) App.room.presence({ pk: App.pubJwk, prof: Prefs.prof || null }).catch(() => markNet(true));
}
// 是否正在牌局里：坐着（没暂离）、报名了还没结束的比赛、或有待房主确认的金币申请（申请挂在在线状态上，断开就看不到了）。
// 在牌局里的页面不会因为闲置被断开（见 cloud.js 的省电断开）
window.VX_ENGAGED = () => {
  const me = App.me; if (!me) return false;
  if (Object.values(App.tables || {}).some(t => t && t.seats && t.seats.some(s => s && s.uid === me && !s.out))) return true;
  if (Object.values(App.events || {}).some(m => m && (m.status === 'waiting' || m.status === 'playing') && (m.entrants || []).includes(me))) return true;
  return !!(App.pendingReq && !(App.wallets && App.wallets[me] && App.wallets[me].reqSeq >= App.pendingReq.seq));
};
function subscribeAll() {
  const db = App.db; if (!db) return;
  unsubs.forEach(u => { try { typeof u === 'function' && u(); } catch (e) { } }); unsubs = [];
  App.lastResub = now();
  const ok = () => { if (App.netDown) markNet(false); };
  const coll = (name, fn) => unsubs.push(db.collection(name).onSnapshot(snap => { ok(); const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); fn(o); scheduleRender(); }, snapErr(name)));
  const loadTimer = setTimeout(() => { if (!App.gotTables) { App.loadErr = '数据连接较慢，稍后会自动刷新…'; render(); } }, 10000);
  unsubs.push(db.collection('live').onSnapshot(snap => {
    App.gotTables = true; clearTimeout(loadTimer); ok(); if (/较慢/.test(App.loadErr || '')) App.loadErr = '';
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
    App.tables = o;
    syncHoles(o); resolveNames(); scheduleRender();
  }, snapErr('live')));
  unsubs.push(db.doc('hostlock/main').onSnapshot(d => {
    App.gotBeat = true; const v = d.exists ? d.data() : null;
    if (v && v.beat && !d.metadata.fromCache) { App.beat = v.beat; skewSample(v.beat - now()); ok(); }
    scheduleRender();
  }, snapErr('beat')));
  coll('wallets', o => { App.wallets = o; resolveNames(); });
  coll('events', o => { App.events = o; });
  coll('stats', o => { App.stats = o; });
  coll('profiles', o => { App.profiles = o; });
  unsubs.push(db.collection('sessions').orderBy('since', 'desc').limit(30).onSnapshot(snap => { App.sessions = {}; snap.docs.forEach(d => { App.sessions[d.id] = d.data(); }); scheduleRender(); }, snapErr('sessions')));
  unsubs.push(db.doc('club/info').onSnapshot(d => {
    App.club = d.exists ? d.data() : null;
    if (coAdmin() && !App.remote) App.remote = new RemoteHost(); else if (!App.isOwner && !coAdmin() && App.remote) App.remote = null;
    scheduleRender();
  }, snapErr('club')));
  unsubs.push(db.doc('club/highlights').onSnapshot(d => { App.highlights = d.exists ? d.data() : null; scheduleRender(); }, snapErr('hl')));
  unsubs.push(db.collection('ledger').orderBy('at', 'desc').limit(400).onSnapshot(snap => { App.ledger = snap.docs.map(d => d.data()); scheduleRender(); }, snapErr('ledger')));
  unsubs.push(db.collection('bracelets').orderBy('at', 'desc').limit(100).onSnapshot(snap => { App.bracelets = snap.docs.map(d => d.data()); resolveNames(); scheduleRender(); }, snapErr('bracelets')));
}

async function tryHost() {
  const db = App.db;
  const lock = db.doc('hostlock/main');
  const tick = async () => {
    try {
      const r = await lock.acquire({ holder: TAB_ID, ttlMs: 20000, data: { beat: now() } });
      if (r.acquired && !App.host) await becomeHost();
      if (!r.acquired && App.host) { App.host.stop(); App.host = null; toast('主持权已转到另一个标签页'); render(); }
    } catch (e) { console.warn('lock', e); }
  };
  await tick(); setInterval(tick, 7000);
}
async function becomeHost() {
  const H = new Host('online');
  const [ws, mine] = await Promise.all([App.db.collection('wallets').get(), App.db.collection('data/users/' + App.me).get()]);
  ws.docs.forEach(d => { if (d.exists) H.wallets[d.id] = d.data(); });
  try { (await App.db.collection('events').get()).docs.forEach(d => { if (d.exists) H.mtts[d.id] = d.data(); }); } catch (e) { }
  try { (await App.db.collection('stats').get()).docs.forEach(d => { if (d.exists) H.stats[d.id] = d.data(); }); } catch (e) { }
  try { const d = await App.db.doc('club/highlights').get(); if (d.exists) H.hl = d.data(); } catch (e) { }
  try { const d = await App.db.doc('club/info').get(); if (d.exists) H.club = d.data(); } catch (e) { }
  try { (await App.db.collection('profiles').get()).docs.forEach(d => { if (d.exists) { const c = cleanProf(d.data()); if (c) H.profiles[d.id] = c; } }); } catch (e) { }
  mine.docs.forEach(d => {
    if (!d.exists) return; const v = d.data();
    if (d.id === 'meta') H.lastSeq = Object.assign({}, v.lastSeq || {});
    else if (d.id.startsWith('eng-') && v.t) {
      const t = JSON.parse(JSON.stringify(v.t));
      if (t.toAct >= 0) t.deadline = now() + t.actionSecs * 1000;
      H.tables[t.id] = t;
    }
  });
  // 本地申请（房主自己）
  await H.restoreKeys();
  App.host = H; H.start();
  if (App.room) H.onPeers(App.room.peers());
  Object.keys(H.tables).forEach(id => H.changed(id));
  toast('你是房主，本页正在主持牌局（请保持打开）');
  render();
}

function chatMode() { const c = App.ctx === 'online' ? (App.host ? App.host.club : App.club) : null; return (c && c.chat) || 'on'; }
function chatAllowed(text) { const m = chatMode(); return m === 'on' || (m === 'emoji' && (REACTS.includes(text) || QUICK.includes(text))); }
function takeChats(peers) {
  peers.forEach(p => {
    const c = p.presence && p.presence.chat; if (!c || !p.by || typeof c.text !== 'string') return;
    const k = p.peer; if ((App.chatSeq[k] || 0) >= c.seq) return;
    App.chatSeq[k] = c.seq;
    if (now() - c.seq > 120000) return; // 旧消息不重放
    if (!chatAllowed(c.text) || isMuted(p.by)) return;
    App.chats.push({ uid: p.by, tid: String(c.tid || ''), text: c.text.slice(0, 60), at: now() });
    if (App.chats.length > 300) App.chats.shift();
    if (!p.isMe) SFX.tick();
    setTimeout(scheduleRender, 5100);
  });
}
const skewS = [];
function skewSample(x) { skewS.push(x); if (skewS.length > 8) skewS.shift(); App.clockSkew = Math.max(...skewS); }
let nameReq = new Set();
async function resolveNames() {
  if (!App.user || !App.user.profiles) return;
  const ids = new Set();
  Object.keys(App.wallets).forEach(u => ids.add(u));
  App.peers.forEach(p => p.by && ids.add(p.by));
  Object.values(App.tables).forEach(t => t.seats.forEach(s => s && !s.bot && ids.add(s.uid)));
  App.bracelets.forEach(b => ids.add(b.uid));
  App.ledger.forEach(l => ids.add(l.uid));
  if (App.host) Object.values(App.host.tables).forEach(t => t.seats.forEach(s => s && !s.bot && ids.add(s.uid)));
  const need = [...ids].filter(u => u && !App.names[u] && !nameReq.has(u));
  if (!need.length) return;
  need.forEach(u => nameReq.add(u));
  try {
    const ps = await App.user.profiles(need);
    need.forEach(u => { const p = ps && ps[u]; if (p && p.name) App.names[u] = p.name; });
    scheduleRender();
  } catch (e) { }
}

// 键盘快捷键（电脑）：F 弃牌 · C 过牌/跟注 · R 加注 · A 全下
document.addEventListener('keydown', e => {
  if (App.view !== 'table' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;

  else if (k === 'c' || k === ' ') click('.btn.big.green');
  else if (k === 'r' || k === 'enter') click('.btn.big.gold');
  else if (k === 'a') { const b = [...bar.querySelectorAll('button')].find(x => x.textContent.trim() === '全下'); if (b) { e.preventDefault(); b.click(); } }
});
